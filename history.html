<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScrimZone Nepal — Match History</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    body {
      background: #070a10;
      color: #fff;
      font-family: 'Inter', sans-serif;
      margin: 0; padding: 40px 20px;
    }

    .history-wrapper {
      max-width: 1000px;
      margin: 0 auto;
      background: #0e141f;
      border: 1px solid #1f2b40;
      border-radius: 12px;
      padding: 30px;
    }

    .page-title {
      font-family: 'Teko', sans-serif;
      font-size: 36px;
      color: #ffb300;
      text-transform: uppercase;
      letter-spacing: 1px;
      line-height: 1;
      margin-bottom: 5px;
    }
    
    .page-sub {
      color: #7e8fa4;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 30px;
    }

    .history-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .match-card {
      background: #141d2d;
      border: 1px solid #1f2b40;
      border-radius: 8px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s;
    }
    .match-card:hover { border-color: #ff9800; transform: translateY(-3px); }

    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #1f2b40;
    }

    .match-num {
      font-family: 'Teko', sans-serif;
      font-size: 28px;
      color: #ffffff;
      line-height: 1;
    }

    .match-map {
      background: rgba(25, 118, 210, 0.15);
      color: #64b5f6;
      border: 1px solid #1976d2;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .winner-label { font-size: 11px; color: #7e8fa4; text-transform: uppercase; font-weight: 700; margin-bottom: 6px; }
    
    .winner-team {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .winner-logo {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      background: #090e17;
      border: 1px solid #ffb300;
      object-fit: cover;
    }

    .winner-name {
      font-size: 18px;
      font-weight: 700;
      color: #ffb300;
      text-transform: uppercase;
    }

    .match-time {
      position: absolute;
      bottom: 12px;
      right: 15px;
      font-size: 11px;
      color: #5c728a;
    }

  </style>
</head>
<body>

  <div class="history-wrapper">
    <div class="page-title">MATCH HISTORY</div>
    <div class="page-sub">Archived Tournament Results & Booyahs</div>

    <div class="history-grid" id="history-grid">
      <div style="color: #7e8fa4;">Fetching logs from database...</div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBRcMrsrifYv-VDsCrTMKZuQiub30a7wEs",
      authDomain: "tournment-leaderboard.firebaseapp.com",
      databaseURL: "https://tournment-leaderboard-default-rtdb.firebaseio.com",
      projectId: "tournment-leaderboard"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref("esports_data/history").limitToLast(24).on("value", snap => {
      const data = snap.val();
      const grid = document.getElementById("history-grid");
      grid.innerHTML = "";

      if (!data) {
        grid.innerHTML = `<div style="color: #7e8fa4;">No completed matches found.</div>`;
        return;
      }

      // Reverse so newest matches are first
      const matches = Object.values(data).reverse();

      matches.forEach(m => {
        const timeStr = m.timestamp 
          ? new Date(m.timestamp * 1000).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' }) 
          : 'Unknown Time';

        const map = m.map || 'BERMUDA';
        const teamName = m.team_name || 'UNKNOWN';
        const booyahs = m.booyahs || 1;

        grid.innerHTML += `
          <div class="match-card">
            <div class="match-header">
              <div class="match-num">MATCH LOG</div>
              <div class="match-map">${map}</div>
            </div>
            
            <div class="winner-label">🏆 BOOYAH TAKEN BY</div>
            <div class="winner-team">
              <img src="https://via.placeholder.com/40/090e17/ffb300?text=W" class="winner-logo" alt="Logo">
              <div>
                <div class="winner-name">${teamName}</div>
                <div style="font-size: 12px; color: #fff; font-weight: 600; margin-top: 2px;">Secured ${booyahs} Booyahs</div>
              </div>
            </div>

            <div class="match-time">${timeStr}</div>
          </div>
        `;
      });
    });
  </script>
</body>
</html>

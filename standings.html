<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScrimZone Nepal — Tournament Standings</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Rajdhani:wght@600;700;800&family=Inter:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent; /* Set to a dark color if not using in OBS */
      font-family: 'Inter', sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      padding: 40px;
    }

    .standings-container {
      width: 100%;
      max-width: 900px;
      background: linear-gradient(180deg, rgba(11, 16, 26, 0.95) 0%, rgba(7, 10, 16, 0.98) 100%);
      border: 2px solid #1f2b40;
      border-radius: 12px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.9);
      overflow: hidden;
    }

    .header-banner {
      background: linear-gradient(90deg, #0d1522 0%, #1565c0 100%);
      border-bottom: 3px solid #ffb300;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title-group {
      display: flex;
      flex-direction: column;
    }

    .main-title {
      font-family: 'Teko', sans-serif;
      font-size: 42px;
      color: #ffffff;
      line-height: 1;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    .sub-title {
      font-family: 'Rajdhani', sans-serif;
      color: #ffca28;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .table-header {
      display: grid;
      grid-template-columns: 60px 1fr 120px 120px;
      padding: 15px 30px;
      background: rgba(0, 0, 0, 0.4);
      border-bottom: 1px solid #1f2b40;
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      font-weight: 800;
      color: #90a4ae;
      letter-spacing: 1px;
    }

    .table-header div.center { text-align: center; }

    .standings-list {
      display: flex;
      flex-direction: column;
    }

    .team-row {
      display: grid;
      grid-template-columns: 60px 1fr 120px 120px;
      padding: 12px 30px;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      transition: background 0.2s ease;
    }

    .team-row:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
    .team-row:hover { background: rgba(255, 152, 0, 0.1); }

    /* Top 3 Highlighting */
    .team-row.rank-1 .rank-num { color: #ffca28; text-shadow: 0 0 10px rgba(255,202,40,0.5); }
    .team-row.rank-2 .rank-num { color: #cfd8dc; }
    .team-row.rank-3 .rank-num { color: #d84315; }

    .rank-num {
      font-family: 'Teko', sans-serif;
      font-size: 32px;
      color: #ff9800;
      font-weight: 700;
    }

    .team-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .team-logo {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      border: 1px solid #2a3a52;
      background: #000;
      object-fit: cover;
    }

    .team-name {
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-val {
      font-family: 'Teko', sans-serif;
      font-size: 28px;
      text-align: center;
      color: #fff;
    }

    .stat-pts {
      color: #64b5f6;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="standings-container">
    <div class="header-banner">
      <div class="title-group">
        <div class="main-title">TOURNAMENT STANDINGS</div>
        <div class="sub-title">OVERALL LEADERBOARD</div>
      </div>
      <div>
        <img src="https://via.placeholder.com/60/000000/ffb300?text=SZ" style="border-radius: 8px; border: 2px solid #ffb300;" alt="Logo">
      </div>
    </div>

    <div class="table-header">
      <div>#</div>
      <div>TEAM</div>
      <div class="center">BOOYAH</div>
      <div class="center">POINTS</div>
    </div>

    <div class="standings-list" id="standings-list">
      <!-- Teams injected here -->
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBRcMrsrifYv-VDsCrTMKZuQiub30a7wEs",
      authDomain: "tournment-leaderboard.firebaseapp.com",
      databaseURL: "https://tournment-leaderboard-default-rtdb.firebaseio.com",
      projectId: "tournment-leaderboard"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Fetch Teams and Sort by Points / Booyahs
    db.ref("esports_data/teams").on("value", snap => {
      let teams = snap.val() || [];
      
      // Filter out empty open slots
      let activeTeams = teams.filter(t => t && t.name && !t.name.includes("OPEN"));

      // For demonstration, calculate fake points if standard points aren't explicitly saved.
      // (1 Booyah = 10 points + base participation 5 points)
      activeTeams = activeTeams.map(t => ({
        ...t,
        points: t.points !== undefined ? t.points : ((t.booyahs || 0) * 10) + 5
      }));

      // Sort: Highest Points First, then Highest Booyahs
      activeTeams.sort((a, b) => {
        if (b.points !== a.points) return b.points - a.points;
        return (b.booyahs || 0) - (a.booyahs || 0);
      });

      const list = document.getElementById("standings-list");
      list.innerHTML = "";

      if (activeTeams.length === 0) {
        list.innerHTML = `<div style="padding: 30px; text-align: center; color: #7e8fa4;">No teams are currently playing.</div>`;
        return;
      }

      activeTeams.forEach((t, index) => {
        const rank = index + 1;
        const logo = t.logo || "https://via.placeholder.com/36/090e17/7e8fa4?text=S";
        const booyahs = t.booyahs || 0;

        list.innerHTML += `
          <div class="team-row rank-${rank}">
            <div class="rank-num">${rank}</div>
            <div class="team-info">
              <img src="${logo}" class="team-logo" onerror="this.src='https://via.placeholder.com/36/090e17/7e8fa4?text=S'">
              <div class="team-name">${t.name || t.teamName || 'UNKNOWN'}</div>
            </div>
            <div class="stat-val">${booyahs} 🏆</div>
            <div class="stat-val stat-pts">${t.points}</div>
          </div>
        `;
      });
    });
  </script>
</body>
</html>

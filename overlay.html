<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Esports HUD Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&family=Chakra+Petch:wght@700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    font-family: 'Rajdhani', sans-serif;
    padding: 20px;
    overflow: hidden;
    user-select: none;
  }

  .hud-container {
    width: 255px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 24px rgba(0,0,0,0.7);
  }

  /* Neon Green Header */
  .hud-header {
    background: #8cf000;
    color: #0b1500;
    display: grid;
    grid-template-columns: 120px 48px 1fr;
    align-items: center;
    padding: 3px 8px;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.5px;
    border-radius: 4px 4px 0 0;
  }
  .hud-header .col-teams { text-align: center; }
  .hud-header .col-elims { text-align: center; }
  .hud-header .col-alive { text-align: center; }

  /* Leaderboard Rows */
  .hud-body {
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: rgba(0, 0, 0, 0.6);
  }

  .hud-row {
    background: rgba(14, 25, 18, 0.94);
    border-left: 3px solid #8cf000;
    display: grid;
    grid-template-columns: 120px 48px 1fr;
    align-items: center;
    padding: 3px 6px;
    min-height: 31px;
    position: relative;
    transition: all 0.2s ease;
  }

  .hud-row.eliminated-row {
    opacity: 0.35;
    filter: grayscale(0.8);
    border-left-color: #2b302c;
    background: rgba(10, 14, 12, 0.92);
  }

  /* Team Info (Rank + Logo + Name) */
  .team-cell {
    display: flex;
    align-items: center;
    gap: 6px;
    overflow: hidden;
  }
  .rank-tag {
    color: #8cf000;
    font-size: 12px;
    font-weight: 800;
    min-width: 14px;
    text-align: right;
  }
  .team-logo {
    width: 19px;
    height: 19px;
    object-fit: contain;
    border-radius: 2px;
  }
  .team-name {
    font-weight: 800;
    font-size: 14px;
    color: #8cf000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.5px;
  }

  /* Elims Column */
  .elims-cell {
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    color: #ffffff;
    border-left: 1px solid rgba(255, 255, 255, 0.15);
    border-right: 1px solid rgba(255, 255, 255, 0.15);
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 4 Alive Status Bars */
  .alive-bars {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 3.5px;
    padding: 0 4px;
  }
  .bar {
    width: 4.5px;
    height: 18px;
    border-radius: 1px;
    transition: background 0.15s ease;
  }
  .bar.status-alive { background: #8cf000; }
  .bar.status-knock { background: #6c5ce7; }
  .bar.status-dead  { background: #000000; }

  /* Legend Footer */
  .hud-legend {
    background: #ffffff;
    color: #111;
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    padding: 3px 6px;
    font-size: 9px;
    font-weight: 800;
    border-radius: 0 0 4px 4px;
    letter-spacing: 0.4px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .legend-box {
    width: 7px;
    height: 7px;
    display: inline-block;
  }
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="hud-container">
    <div class="hud-header">
      <span class="col-teams">TEAMS</span>
      <span class="col-elims">ELIMS</span>
      <span class="col-alive">ALIVE</span>
    </div>

    <div class="hud-body" id="hud-body"></div>

    <div class="hud-legend">
      <div class="legend-item">
        <span class="legend-box" style="background:#8cf000;"></span>
        <span>ALIVE</span>
      </div>
      <div class="legend-item">
        <span class="legend-box" style="background:#6c5ce7;"></span>
        <span>KNOCK</span>
      </div>
      <div class="legend-item">
        <span class="legend-box" style="background:#000000;"></span>
        <span>ELIMINATED</span>
      </div>
    </div>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBRcMrsrifYv-VDsCrTMKZuQiub30a7wEs",
    authDomain: "tournment-leaderboard.firebaseapp.com",
    databaseURL: "https://tournment-leaderboard-default-rtdb.firebaseio.com",
    projectId: "tournment-leaderboard",
    storageBucket: "tournment-leaderboard.firebasestorage.app",
    messagingSenderId: "685244342962",
    appId: "1:685244342962:web:d31c15a67fb9b6161f5fab",
    measurementId: "G-RKSK1ZBC5M"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  db.ref('esports_data/teams').on('value', (snapshot) => {
    const teams = snapshot.val();
    if (teams && Array.isArray(teams)) renderOverlay(teams);
  });

  function renderOverlay(teams) {
    const container = document.getElementById('hud-body');
    container.innerHTML = '';

    // Sort by elims descending
    const sorted = [...teams].sort((a, b) => {
      const elimsA = Number(a.kills) || 0;
      const elimsB = Number(b.kills) || 0;
      if (elimsB !== elimsA) return elimsB - elimsA;
      return (Number(b.alive) || 0) - (Number(a.alive) || 0);
    });

    sorted.forEach((team, index) => {
      const elims = Number(team.kills) || 0;
      const players = team.players || [
        { status: 'alive' }, { status: 'alive' },
        { status: 'alive' }, { status: 'alive' }
      ];

      // Check if squad is completely eliminated
      const isEliminated = players.every(p => p.status === 'dead');

      let barsHtml = '';
      players.slice(0, 4).forEach(p => {
        barsHtml += `<div class="bar status-${p.status || 'alive'}"></div>`;
      });

      container.innerHTML += `
        <div class="hud-row ${isEliminated ? 'eliminated-row' : ''}">
          <div class="team-cell">
            <span class="rank-tag">${index + 1}</span>
            <img class="team-logo" src="${team.logo || 'https://dummyimage.com/19x19/000/8cf000&text=' + (team.name ? team.name[0] : '#')}" />
            <span class="team-name">${team.name || 'SLOT'}</span>
          </div>
          <div class="elims-cell">${elims}</div>
          <div class="alive-bars">${barsHtml}</div>
        </div>
      `;
    });
  }
</script>
</body>
</html>

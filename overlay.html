<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OBS Esports HUD Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&family=Chakra+Petch:wght@700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    font-family: 'Rajdhani', sans-serif;
    padding: 20px;
    overflow: hidden;
    user-select: none;
  }

  /* 1. Top Elimination Pop-out Alert Banner */
  #elim-banner {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-180%);
    background: #000000;
    border: 2px solid #426aef;
    border-radius: 6px;
    padding: 8px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 0 25px rgba(66, 106, 239, 0.7);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 9999;
  }
  #elim-banner.show { transform: translateX(-50%) translateY(0); }
  #elim-banner img { width: 30px; height: 30px; border-radius: 4px; object-fit: contain; }
  #elim-banner .banner-text {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #ffffff;
    line-height: 1;
    text-transform: uppercase;
  }
  #elim-banner .banner-text span { color: #426aef; }

  /* 2. HUD Container */
  .hud-container {
    width: 260px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 24px rgba(0,0,0,0.8);
    border: 1px solid #426aef;
    border-radius: 6px 6px 0 0;
    overflow: hidden;
  }

  /* Match Timer Bar */
  .hud-timer-bar {
    background: #000000;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 10px;
    border-bottom: 1px solid rgba(66, 106, 239, 0.35);
  }
  .hud-timer-label {
    font-size: 11px;
    font-weight: 800;
    color: #8e929b;
    letter-spacing: 1px;
  }
  .hud-timer-clock {
    font-size: 15px;
    font-weight: 800;
    color: #426aef;
    font-family: 'Chakra Petch', sans-serif;
    letter-spacing: 1px;
  }

  /* Blue Header */
  .hud-header {
    background: #426aef;
    color: #ffffff;
    display: grid;
    grid-template-columns: 120px 48px 1fr;
    align-items: center;
    padding: 4px 8px;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.5px;
  }
  .hud-header .col-teams { text-align: center; }
  .hud-header .col-elims { text-align: center; }
  .hud-header .col-alive { text-align: center; }

  /* Leaderboard Body */
  .hud-body {
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: #000000;
  }

  /* Active Team Row */
  .hud-row {
    background: #0d1017;
    border-left: 3px solid #426aef;
    display: grid;
    grid-template-columns: 120px 48px 1fr;
    align-items: center;
    padding: 3px 6px;
    min-height: 32px;
    transition: background 0.2s ease;
  }

  /* Eliminated Team Row - Completely solid black (no transparency / no back elements visible) */
  .hud-row.eliminated-row {
    opacity: 1 !important;
    background: #000000 !important;
    border-left-color: #222222 !important;
  }
  .hud-row.eliminated-row .team-name { color: #555555 !important; }
  .hud-row.eliminated-row .rank-tag { color: #444444 !important; }
  .hud-row.eliminated-row .elims-cell { color: #444444 !important; }
  .hud-row.eliminated-row .team-logo { filter: grayscale(1) opacity(0.35); }

  /* Team Identifiers */
  .team-cell {
    display: flex;
    align-items: center;
    gap: 6px;
    overflow: hidden;
  }
  .rank-tag {
    color: #426aef;
    font-size: 12px;
    font-weight: 800;
    min-width: 15px;
    text-align: right;
  }
  .team-logo {
    width: 20px;
    height: 20px;
    object-fit: contain;
    border-radius: 2px;
  }
  .team-name {
    font-weight: 800;
    font-size: 14px;
    color: #ffffff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.5px;
  }

  /* Elims Column */
  .elims-cell {
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    color: #ffffff;
    border-left: 1px solid rgba(255, 255, 255, 0.1);
    border-right: 1px solid rgba(255, 255, 255, 0.1);
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Alive Indicator Status Bars */
  .alive-bars {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 3.5px;
    padding: 0 4px;
  }
  .bar {
    width: 4.5px;
    height: 18px;
    border-radius: 1px;
  }
  .bar.status-alive { background: #426aef; box-shadow: 0 0 5px rgba(66, 106, 239, 0.5); }
  .bar.status-dead  { background: #1a1a1a; }

  /* Legend Footer */
  .hud-legend {
    background: #000000;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    padding: 5px 6px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.4px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .legend-box {
    width: 8px;
    height: 8px;
    display: inline-block;
  }
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- Top Center Alert Banner -->
  <div id="elim-banner">
    <img id="banner-logo" src="" alt="logo" />
    <div class="banner-text" id="banner-text">TEAM ELIMINATED</div>
  </div>

  <!-- Main Tournament HUD -->
  <div class="hud-container">
    <!-- Top Timer -->
    <div class="hud-timer-bar">
      <span class="hud-timer-label">MATCH TIME</span>
      <span class="hud-timer-clock" id="timer-display">00:00</span>
    </div>

    <!-- Header -->
    <div class="hud-header">
      <span class="col-teams">TEAMS</span>
      <span class="col-elims">ELIMS</span>
      <span class="col-alive">ALIVE</span>
    </div>

    <div class="hud-body" id="hud-body"></div>

    <!-- Solid Footer Legend -->
    <div class="hud-legend">
      <div class="legend-item">
        <span class="legend-box" style="background:#426aef;"></span>
        <span>ALIVE</span>
      </div>
      <div class="legend-item">
        <span class="legend-box" style="background:#1a1a1a; border: 1px solid #333;"></span>
        <span>ELIMINATED</span>
      </div>
    </div>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBRcMrsrifYv-VDsCrTMKZuQiub30a7wEs",
    authDomain: "tournment-leaderboard.firebaseapp.com",
    databaseURL: "https://tournment-leaderboard-default-rtdb.firebaseio.com",
    projectId: "tournment-leaderboard",
    storageBucket: "tournment-leaderboard.firebasestorage.app",
    messagingSenderId: "685244342962",
    appId: "1:685244342962:web:d31c15a67fb9b6161f5fab",
    measurementId: "G-RKSK1ZBC5M"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let previousTeams = [];
  let bannerTimer = null;

  // Banner trigger animation
  function showEliminationBanner(name, logo) {
    const banner = document.getElementById('elim-banner');
    const bText = document.getElementById('banner-text');
    const bLogo = document.getElementById('banner-logo');

    bText.innerHTML = `<span>${name}</span> SQUAD ELIMINATED`;
    bLogo.src = logo || ('https://dummyimage.com/30x30/000/426aef&text=' + (name ? name[0] : '#'));
    banner.classList.add('show');

    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => {
      banner.classList.remove('show');
    }, 3800);
  }

  // Real-time Database Sync
  db.ref('esports_data/teams').on('value', (snapshot) => {
    const teams = snapshot.val();
    if (teams && Array.isArray(teams)) renderOverlay(teams);
  });

  // Timer Sync
  let timerState = { running: false, seconds: 0, startTimestamp: null };
  let localTimerInterval = null;

  db.ref('esports_data/timer').on('value', (snapshot) => {
    const val = snapshot.val();
    if (val) {
      timerState = val;
      updateTimerUI();
    }
  });

  function formatTime(totalSec) {
    const m = String(Math.floor(totalSec / 60)).padStart(2, '0');
    const s = String(totalSec % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  function updateTimerUI() {
    clearInterval(localTimerInterval);
    if (timerState.running && timerState.startTimestamp) {
      localTimerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - timerState.startTimestamp) / 1000);
        document.getElementById('timer-display').innerText = formatTime(elapsed);
      }, 1000);
      const elapsed = Math.floor((Date.now() - timerState.startTimestamp) / 1000);
      document.getElementById('timer-display').innerText = formatTime(elapsed);
    } else {
      document.getElementById('timer-display').innerText = formatTime(timerState.seconds || 0);
    }
  }

  function renderOverlay(teams) {
    // Check if any team just got wiped out to fire the banner
    if (previousTeams.length > 0) {
      teams.forEach(curr => {
        const prev = previousTeams.find(p => p.name === curr.name);
        if (prev) {
          const prevAlive = (prev.players || []).some(p => p.status !== 'dead');
          const currAlive = (curr.players || []).some(p => p.status !== 'dead');
          if (prevAlive && !currAlive) {
            showEliminationBanner(curr.name, curr.logo);
          }
        }
      });
    }
    previousTeams = JSON.parse(JSON.stringify(teams));

    const container = document.getElementById('hud-body');
    container.innerHTML = '';

    // Sort by elims descending
    const sorted = [...teams].sort((a, b) => {
      const elimsA = Number(a.kills) || 0;
      const elimsB = Number(b.kills) || 0;
      if (elimsB !== elimsA) return elimsB - elimsA;
      return (Number(b.alive) || 0) - (Number(a.alive) || 0);
    });

    sorted.forEach((team, index) => {
      const elims = Number(team.kills) || 0;
      const players = team.players || [
        { status: 'alive' }, { status: 'alive' },
        { status: 'alive' }, { status: 'alive' }
      ];

      const isEliminated = players.every(p => p.status === 'dead');

      let barsHtml = '';
      players.slice(0, 4).forEach(p => {
        barsHtml += `<div class="bar status-${p.status === 'dead' ? 'dead' : 'alive'}"></div>`;
      });

      container.innerHTML += `
        <div class="hud-row ${isEliminated ? 'eliminated-row' : ''}">
          <div class="team-cell">
            <span class="rank-tag">${index + 1}</span>
            <img class="team-logo" src="${team.logo || 'https://dummyimage.com/20x20/000/426aef&text=' + (team.name ? team.name[0] : '#')}" />
            <span class="team-name">${team.name || 'SLOT'}</span>
          </div>
          <div class="elims-cell">${elims}</div>
          <div class="alive-bars">${barsHtml}</div>
        </div>
      `;
    });
  }
</script>
</body>
</html>

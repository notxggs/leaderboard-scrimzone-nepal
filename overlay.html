<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OBS Esports Leaderboard Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Teko:wght@700&family=Rajdhani:wght@700;800&family=Chakra+Petch:wght@700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: transparent;
    font-family: 'Rajdhani', sans-serif;
    overflow: hidden;
    user-select: none;
    display: inline-block;
  }

  /* LEADERBOARD WRAPPER (Fits content perfectly for OBS Alt-Crop) */
  .broadcast-dock {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: fit-content;
    padding: 10px;
    position: relative;
  }

  /* 1. SEPARATED SQUAD WIPEOUT ALERT (Does not affect table width) */
  #elim-banner {
    width: 100%;
    background: linear-gradient(135deg, rgba(20, 5, 8, 0.98) 0%, rgba(200, 20, 30, 0.95) 50%, rgba(15, 3, 5, 0.98) 100%);
    border: 2px solid #ff2233;
    border-radius: 6px;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 0 30px rgba(255, 30, 50, 0.85);
    transform: translateY(-160%) scale(0.9);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.45s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.3s ease;
  }
  #elim-banner.show {
    transform: translateY(0) scale(1);
    opacity: 1;
    animation: bannerAlertGlow 1s infinite alternate ease-in-out;
  }

  @keyframes bannerAlertGlow {
    0% { box-shadow: 0 0 15px rgba(255, 0, 0, 0.7); }
    100% { box-shadow: 0 0 35px rgba(255, 0, 0, 1); }
  }

  .skull-badge {
    font-size: 32px;
    line-height: 1;
    filter: drop-shadow(0 0 10px #ff0033);
    flex-shrink: 0;
  }

  #banner-logo {
    width: 40px;
    height: 40px;
    border-radius: 4px;
    object-fit: contain;
    border: 2px solid #ff2233;
    background: #000;
    flex-shrink: 0;
  }

  .banner-text-box {
    display: flex;
    flex-direction: column;
    justify-content: center;
    line-height: 0.95;
    white-space: nowrap;
  }
  .banner-primary {
    font-family: 'Teko', sans-serif;
    font-size: 28px;
    letter-spacing: 1px;
    color: #ffffff;
    text-transform: uppercase;
  }
  .banner-primary span {
    color: #ffe600;
    font-size: 32px;
  }
  .banner-tagline {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 11px;
    font-weight: 800;
    color: #ff9999;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* 2. UNIFIED CSS MASTER TABLE */
  .hud-container {
    width: fit-content;
    display: table;
    border-collapse: separate;
    border-spacing: 0;
    box-shadow: 0 12px 35px rgba(0,0,0,0.9);
    border: 2px solid #426aef;
    border-radius: 6px;
    overflow: hidden;
    background: #000000;
  }

  /* Match Timer Bar Header */
  .hud-timer-bar {
    display: table-caption;
    caption-side: top;
    background: #000000;
    padding: 6px 14px;
    border-bottom: 2px solid rgba(66, 106, 239, 0.4);
  }
  .timer-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .hud-timer-label {
    font-size: 13px;
    font-weight: 800;
    color: #8fa0b5;
    letter-spacing: 1.5px;
  }
  .hud-timer-clock {
    font-size: 20px;
    font-weight: 800;
    color: #426aef;
    font-family: 'Chakra Petch', sans-serif;
    letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(66, 106, 239, 0.7);
  }

  /* Header Row */
  .hud-header {
    display: table-row;
    background: #426aef;
    color: #ffffff;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 1px;
  }
  .hud-header .col-teams {
    display: table-cell;
    text-align: left;
    padding: 6px 20px 6px 24px;
    white-space: nowrap;
    min-width: 170px;
  }
  .hud-header .col-elims {
    display: table-cell;
    text-align: center;
    padding: 6px 12px;
    width: 65px;
    min-width: 65px;
  }
  .hud-header .col-alive {
    display: table-cell;
    text-align: center;
    padding: 6px 16px;
    width: 80px;
    min-width: 80px;
  }

  /* Body Rows */
  .hud-body {
    display: table-row-group;
  }

  .hud-row {
    display: table-row;
    background: #0a0d14;
    transition: background 0.3s ease;
  }
  .hud-row:nth-child(even) {
    background: #0c1018;
  }

  /* Eliminated Team Row */
  .hud-row.eliminated-row {
    background: #000000 !important;
  }
  .hud-row.eliminated-row .team-name { color: #3b4252 !important; }
  .hud-row.eliminated-row .rank-tag { color: #2d3340 !important; }
  .hud-row.eliminated-row .elims-cell { color: #3b4252 !important; }
  .hud-row.eliminated-row .team-logo { filter: grayscale(1) opacity(0.2); }

  /* Red Shock Laser Effect */
  .hud-row.just-vanished {
    animation: rowGlitchShake 0.4s ease-out;
  }
  @keyframes rowGlitchShake {
    0% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-2px); }
    80% { transform: translateX(2px); }
    100% { transform: translateX(0); }
  }

  /* Team Info Cell */
  .team-cell {
    display: table-cell;
    vertical-align: middle;
    padding: 5px 20px 5px 10px;
    white-space: nowrap;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .team-cell-inner {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .rank-tag {
    color: #426aef;
    font-size: 17px;
    font-weight: 800;
    min-width: 22px;
    text-align: right;
    font-family: 'Chakra Petch', sans-serif;
    flex-shrink: 0;
  }
  .team-logo {
    width: 24px;
    height: 24px;
    object-fit: contain;
    border-radius: 3px;
    background: #000;
    flex-shrink: 0;
  }
  .team-name {
    font-weight: 800;
    font-size: 21px;
    color: #ffffff;
    letter-spacing: 0.8px;
    line-height: 1;
    white-space: nowrap;
  }

  /* Elimination Cell */
  .elims-cell {
    display: table-cell;
    vertical-align: middle;
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    color: #ffffff;
    border-left: 1px solid rgba(255, 255, 255, 0.12);
    border-right: 1px solid rgba(255, 255, 255, 0.12);
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-family: 'Chakra Petch', sans-serif;
    padding: 0 10px;
  }

  /* Alive Status Indicators Cell */
  .alive-cell {
    display: table-cell;
    vertical-align: middle;
    padding: 0 14px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .alive-bars {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
  }
  .bar {
    width: 6px;
    height: 21px;
    border-radius: 1px;
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  .bar.status-alive {
    background: #426aef;
    box-shadow: 0 0 6px rgba(66, 106, 239, 0.7);
  }
  .bar.status-dead {
    background: #141720;
    box-shadow: none;
    border: 1px solid #1e2433;
  }

  /* Legend Footer */
  .hud-legend {
    display: table-caption;
    caption-side: bottom;
    background: #000000;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    color: #ffffff;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.8px;
  }
  .legend-inner {
    display: flex;
    align-items: center;
    justify-content: space-evenly;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .legend-box {
    width: 9px;
    height: 9px;
    border-radius: 1px;
    display: inline-block;
  }
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- Fallback Elimination Audio -->
  <audio id="elimination-audio" preload="auto">
    <source src="https://cdn.freesound.org/previews/381/381382_6142149-lq.mp3" type="audio/mpeg">
  </audio>

  <div class="broadcast-dock">

    <!-- SQUAD WIPEOUT ALERT -->
    <div id="elim-banner">
      <div class="skull-badge">☠</div>
      <img id="banner-logo" src="" alt="logo" />
      <div class="banner-text-box">
        <div class="banner-primary"><span id="banner-team-name">TEAM</span> WIPED</div>
        <div class="banner-tagline">ALL PLAYERS K.I.A</div>
      </div>
    </div>

    <!-- MAIN LEADERBOARD HUD -->
    <div class="hud-container">
      
      <!-- Match Duration -->
      <div class="hud-timer-bar">
        <div class="timer-inner">
          <span class="hud-timer-label">MATCH TIME</span>
          <span class="hud-timer-clock" id="timer-display">00:00</span>
        </div>
      </div>

      <!-- Header Row -->
      <div class="hud-header">
        <div class="col-teams">TEAMS</div>
        <div class="col-elims">ELIMS</div>
        <div class="col-alive">ALIVE</div>
      </div>

      <!-- Body Rows -->
      <div class="hud-body" id="hud-body"></div>

      <!-- Footer Legend -->
      <div class="hud-legend">
        <div class="legend-inner">
          <div class="legend-item">
            <span class="legend-box" style="background:#426aef; box-shadow: 0 0 6px #426aef;"></span>
            <span>ALIVE</span>
          </div>
          <div class="legend-item">
            <span class="legend-box" style="background:#141720; border: 1px solid #333;"></span>
            <span>ELIMINATED</span>
          </div>
        </div>
      </div>

    </div>

  </div>

<script>
  // YOUR REAL FIREBASE CONFIGURATION
  const firebaseConfig = {
    apiKey: "AIzaSyBRcMrsrifYv-VDsCrTMKZuQiub30a7wEs",
    authDomain: "tournment-leaderboard.firebaseapp.com",
    databaseURL: "https://tournment-leaderboard-default-rtdb.firebaseio.com",
    projectId: "tournment-leaderboard",
    storageBucket: "tournment-leaderboard.firebasestorage.app",
    messagingSenderId: "685244342962",
    appId: "1:685244342962:web:d31c15a67fb9b6161f5fab",
    measurementId: "G-RKSK1ZBC5M"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let previousTeams = [];
  let bannerTimer = null;
  const justVaporizedTeams = new Set();

  // Synthetic Bass-Drop Audio Stinger (Guaranteed playback, never CORS blocked)
  function playWipeoutSound() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(32, ctx.currentTime + 0.6);

        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.65);
      }
    } catch(e) {}

    const audio = document.getElementById('elimination-audio');
    if (audio) {
      audio.currentTime = 0;
      audio.volume = 0.85;
      audio.play().catch(() => {});
    }
  }

  function showEliminationBanner(name, logo) {
    playWipeoutSound();

    const banner = document.getElementById('elim-banner');
    const teamSpan = document.getElementById('banner-team-name');
    const bLogo = document.getElementById('banner-logo');

    teamSpan.innerText = name || 'UNKNOWN';
    bLogo.src = logo || ('https://dummyimage.com/40x40/000/fff&text=' + (name ? name[0] : '#'));
    banner.classList.add('show');

    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => {
      banner.classList.remove('show');
    }, 4200);
  }

  // Real-time listener for the teams data
  db.ref('esports_data/teams').on('value', (snapshot) => {
    const teams = snapshot.val();
    if (teams && Array.isArray(teams)) renderOverlay(teams);
  });

  // Real-time listener for the match timer
  let timerState = { running: false, seconds: 0, startTimestamp: null };
  let localTimerInterval = null;

  db.ref('esports_data/timer').on('value', (snapshot) => {
    const val = snapshot.val();
    if (val) {
      timerState = val;
      updateTimerUI();
    }
  });

  function formatTime(totalSec) {
    const m = String(Math.floor(totalSec / 60)).padStart(2, '0');
    const s = String(totalSec % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  function updateTimerUI() {
    clearInterval(localTimerInterval);
    if (timerState.running && timerState.startTimestamp) {
      localTimerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - timerState.startTimestamp) / 1000);
        document.getElementById('timer-display').innerText = formatTime(elapsed);
      }, 1000);
      const elapsed = Math.floor((Date.now() - timerState.startTimestamp) / 1000);
      document.getElementById('timer-display').innerText = formatTime(elapsed);
    } else {
      document.getElementById('timer-display').innerText = formatTime(timerState.seconds || 0);
    }
  }

  function renderOverlay(teams) {
    if (previousTeams.length > 0) {
      teams.forEach((curr, idx) => {
        const prev = previousTeams[idx];
        if (prev) {
          const prevAlive = (prev.players || []).some(p => p.status !== 'dead');
          const currAlive = (curr.players || []).some(p => p.status !== 'dead');
          if (prevAlive && !currAlive) {
            const label = (curr.name && curr.name.trim() !== '') ? curr.name : `SLOT ${idx + 1}`;
            showEliminationBanner(label, curr.logo);
            justVaporizedTeams.add(idx);
            setTimeout(() => {
              justVaporizedTeams.delete(idx);
            }, 1000);
          }
        }
      });
    }
    previousTeams = JSON.parse(JSON.stringify(teams));

    const container = document.getElementById('hud-body');
    container.innerHTML = '';

    // Sort by Kills (Descending), then by Alive count (Descending)
    const indexedTeams = teams.map((team, index) => ({ ...team, originalIndex: index }));
    indexedTeams.sort((a, b) => {
      const elimsA = Number(a.kills) || 0;
      const elimsB = Number(b.kills) || 0;
      if (elimsB !== elimsA) return elimsB - elimsA;
      return (Number(b.alive) || 0) - (Number(a.alive) || 0);
    });

    indexedTeams.forEach((team, rankIndex) => {
      const elims = Number(team.kills) || 0;
      const players = team.players || [
        { status: 'alive' }, { status: 'alive' },
        { status: 'alive' }, { status: 'alive' }
      ];

      const isEliminated = players.every(p => p.status === 'dead');
      const isVaporizing = justVaporizedTeams.has(team.originalIndex);

      let barsHtml = '';
      players.slice(0, 4).forEach(p => {
        barsHtml += `<div class="bar status-${p.status === 'dead' ? 'dead' : 'alive'}"></div>`;
      });

      // Name Fallback: If empty, display SLOT #
      const displayName = (team.name && team.name.trim() !== '') ? team.name : `SLOT ${team.originalIndex + 1}`;
      const displayLogo = (team.logo && team.logo.trim() !== '') ? team.logo : `https://dummyimage.com/24x24/000/426aef&text=${displayName[0]}`;

      container.innerHTML += `
        <div class="hud-row ${isEliminated ? 'eliminated-row' : ''} ${isVaporizing ? 'just-vanished' : ''}">
          <div class="team-cell">
            <div class="team-cell-inner">
              <span class="rank-tag">#${rankIndex + 1}</span>
              <img class="team-logo" src="${displayLogo}" />
              <span class="team-name">${displayName}</span>
            </div>
          </div>
          <div class="elims-cell">${elims}</div>
          <div class="alive-cell">
            <div class="alive-bars">${barsHtml}</div>
          </div>
        </div>
      `;
    });
  }
</script>
</body>
</html>

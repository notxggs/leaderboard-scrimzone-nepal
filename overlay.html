<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBS Esports Broadcast Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Teko:wght@700&family=Rajdhani:wght@700;800&family=Chakra+Petch:wght@700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100vw;
    height: 100vh;
    background: transparent;
    font-family: 'Rajdhani', sans-serif;
    overflow: hidden;
    user-select: none;
    position: relative;
  }

  /* ----------------------------------------------------
     1. EXACT 1:1 TOURNAMENT CURRENT MATCH & TIMER BAR
     (Slanted outward diagonal left edge "/" + bronze backing plate)
     ---------------------------------------------------- */
  #match-timer-dock {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    filter: drop-shadow(0 12px 25px rgba(0, 0, 0, 0.95));
  }

  /* Bronze Backing Shield Plate (Behind top-left) */
  .header-crest {
    position: absolute;
    top: -10px;
    left: -12px;
    width: 60px;
    height: 48px;
    background: linear-gradient(135deg, #7a5c28 0%, #453214 100%);
    border: 1.5px solid #a88438;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    border-radius: 4px 0 0 0;
    z-index: 998;
  }

  /* Top Gold Lip Trim */
  .header-top-lip {
    position: absolute;
    top: -6px;
    left: 45px;
    width: 220px;
    height: 7px;
    background: linear-gradient(180deg, #ffe082 0%, #c9972c 70%, #684a12 100%);
    clip-path: polygon(8% 0%, 92% 0%, 100% 100%, 0% 100%);
    box-shadow: 0 -2px 6px rgba(255, 215, 0, 0.5);
    z-index: 1002;
  }

  /* Outer Gold Slanted Frame: Starts inward at top, flares OUT at bottom (/) */
  .match-outer-frame {
    position: relative;
    background: linear-gradient(180deg, #f3d483 0%, #a4792a 50%, #453210 100%);
    padding: 2.5px;
    clip-path: polygon(36px 0%, 100% 0%, 100% 100%, 0% 100%);
    z-index: 999;
  }

  /* Dark Metallic Body Plate */
  .match-inner-plate {
    background: linear-gradient(180deg, #0d121a 0%, #06080d 100%);
    clip-path: polygon(35px 0%, 100% 0%, 100% 100%, 0% 100%);
    padding: 3px;
    display: flex;
  }

  /* Inner Precision Gold Pinstripe Box */
  .match-pinstripe-box {
    display: flex;
    align-items: center;
    border: 1px solid rgba(220, 185, 90, 0.5);
    clip-path: polygon(34px 0%, 100% 0%, 100% 100%, 0% 100%);
    padding: 8px 24px 8px 38px;
    gap: 18px;
    position: relative;
    background: linear-gradient(90deg, #101929 0%, #070a0f 100%);
  }

  /* Tiny Corner Accents */
  .match-pinstripe-box::before {
    content: '';
    position: absolute;
    top: 5px;
    left: 36px;
    width: 6px;
    height: 1px;
    background: #ffd700;
    box-shadow: 0 0 4px #ffd700;
  }
  .match-pinstripe-box::after {
    content: '';
    position: absolute;
    bottom: 3px;
    right: 3px;
    width: 4px;
    height: 4px;
    background: #d4af37;
    border-radius: 50%;
  }

  /* Typography */
  .current-match-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 0.95;
  }
  .match-main-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 28px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 2px 5px rgba(0,0,0,0.9);
  }
  .match-sub-title {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #e5b95c;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    margin-top: 4px;
    text-shadow: 0 0 10px rgba(229, 185, 92, 0.5);
  }

  .header-divider-line {
    width: 1.5px;
    height: 40px;
    background: linear-gradient(180deg, transparent 0%, rgba(255, 255, 255, 0.25) 50%, transparent 100%);
  }

  .timer-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 0.95;
    min-width: 95px;
  }
  .timer-small-label {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: #8fa0b5;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .hud-timer-clock {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 32px;
    font-weight: 800;
    color: #5c8cf8;
    letter-spacing: 1.5px;
    text-shadow: 0 0 12px rgba(92, 140, 248, 0.7);
    margin-top: 2px;
  }

  /* ----------------------------------------------------
     2. LEFT DOCK: LEADERBOARD & ELIMINATION BANNER
     ---------------------------------------------------- */
  .broadcast-dock {
    position: fixed;
    top: 50px;
    left: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: fit-content;
    z-index: 100;
  }

  #elim-banner {
    width: 100%;
    background: linear-gradient(135deg, rgba(20, 5, 8, 0.98) 0%, rgba(200, 20, 30, 0.95) 50%, rgba(15, 3, 5, 0.98) 100%);
    border: 2px solid #ff2233;
    border-radius: 6px;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 0 30px rgba(255, 30, 50, 0.85);
    transform: translateY(-160%) scale(0.9);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.45s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.3s ease;
  }
  #elim-banner.show {
    transform: translateY(0) scale(1);
    opacity: 1;
    animation: bannerAlertGlow 1s infinite alternate ease-in-out;
  }
  @keyframes bannerAlertGlow {
    0% { box-shadow: 0 0 15px rgba(255, 0, 0, 0.7); }
    100% { box-shadow: 0 0 35px rgba(255, 0, 0, 1); }
  }

  .skull-badge {
    font-size: 32px;
    line-height: 1;
    filter: drop-shadow(0 0 10px #ff0033);
    flex-shrink: 0;
  }
  #banner-logo {
    width: 40px;
    height: 40px;
    border-radius: 4px;
    object-fit: contain;
    border: 2px solid #ff2233;
    background: #000;
    flex-shrink: 0;
  }
  .banner-text-box {
    display: flex;
    flex-direction: column;
    justify-content: center;
    line-height: 0.95;
    white-space: nowrap;
  }
  .banner-primary {
    font-family: 'Teko', sans-serif;
    font-size: 28px;
    letter-spacing: 1px;
    color: #ffffff;
    text-transform: uppercase;
  }
  .banner-primary span { color: #ffe600; font-size: 32px; }
  .banner-tagline {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 11px;
    font-weight: 800;
    color: #ff9999;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Leaderboard Master Table */
  .hud-container {
    width: fit-content;
    display: table;
    border-collapse: separate;
    border-spacing: 0;
    box-shadow: 0 12px 35px rgba(0,0,0,0.9);
    border: 2px solid #426aef;
    border-radius: 6px;
    overflow: hidden;
    background: #000000;
  }

  .hud-header {
    display: table-row;
    background: #426aef;
    color: #ffffff;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 1px;
  }
  .hud-header .col-teams {
    display: table-cell;
    text-align: left;
    padding: 6px 20px 6px 20px;
    white-space: nowrap;
    min-width: 170px;
  }
  .hud-header .col-elims {
    display: table-cell;
    text-align: center;
    padding: 6px 12px;
    width: 65px;
  }
  .hud-header .col-alive {
    display: table-cell;
    text-align: center;
    padding: 6px 16px;
    width: 80px;
  }

  .hud-body { display: table-row-group; }
  .hud-row {
    display: table-row;
    background: #0a0d14;
    transition: background 0.3s ease;
  }
  .hud-row:nth-child(even) { background: #0c1018; }
  .hud-row.eliminated-row { background: #000000 !important; }
  .hud-row.eliminated-row .team-name { color: #3b4252 !important; }
  .hud-row.eliminated-row .rank-tag { color: #2d3340 !important; }
  .hud-row.eliminated-row .elims-cell { color: #3b4252 !important; }
  .hud-row.eliminated-row .team-logo { filter: grayscale(1) opacity(0.2); }

  .team-cell {
    display: table-cell;
    vertical-align: middle;
    padding: 5px 20px 5px 10px;
    white-space: nowrap;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .team-cell-inner { display: flex; align-items: center; gap: 8px; }
  .rank-tag {
    color: #426aef;
    font-size: 17px;
    font-weight: 800;
    min-width: 22px;
    text-align: right;
    font-family: 'Chakra Petch', sans-serif;
  }
  .team-logo {
    width: 24px;
    height: 24px;
    object-fit: contain;
    border-radius: 3px;
    background: #000;
  }
  .team-name {
    font-weight: 800;
    font-size: 20px;
    color: #ffffff;
    letter-spacing: 0.8px;
    line-height: 1;
  }
  .elims-cell {
    display: table-cell;
    vertical-align: middle;
    text-align: center;
    font-size: 21px;
    font-weight: 800;
    color: #ffffff;
    border-left: 1px solid rgba(255, 255, 255, 0.12);
    border-right: 1px solid rgba(255, 255, 255, 0.12);
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-family: 'Chakra Petch', sans-serif;
    padding: 0 10px;
  }
  .alive-cell {
    display: table-cell;
    vertical-align: middle;
    padding: 0 14px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .alive-bars { display: flex; justify-content: center; align-items: center; gap: 4px; }
  .bar {
    width: 6px;
    height: 20px;
    border-radius: 1px;
    transition: background 0.2s ease;
  }
  .bar.status-alive {
    background: #426aef;
    box-shadow: 0 0 6px rgba(66, 106, 239, 0.7);
  }
  .bar.status-dead {
    background: #141720;
    border: 1px solid #1e2433;
  }
  .hud-legend {
    display: table-caption;
    caption-side: bottom;
    background: #000000;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    color: #ffffff;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 800;
  }
  .legend-inner { display: flex; align-items: center; justify-content: space-evenly; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-box { width: 9px; height: 9px; border-radius: 1px; display: inline-block; }

  /* ----------------------------------------------------
     3. BOTTOM-RIGHT OFFICIAL METALLIC SPECTATOR CARD
     ---------------------------------------------------- */
  #official-spec-card {
    position: fixed !important;
    bottom: 25px !important;
    right: 25px !important;
    width: 400px !important;
    background: linear-gradient(180deg, #161b26 0%, #090c12 100%) !important;
    border: 1.5px solid #d4af37 !important;
    border-top: 2px solid #5c84ff !important;
    border-radius: 6px !important;
    padding: 10px 16px !important;
    box-shadow: 0 12px 35px rgba(0,0,0,0.95), inset 0 1px 0 rgba(255, 215, 0, 0.3) !important;
    display: flex !important;
    flex-direction: column !important;
    gap: 8px !important;
    z-index: 999999 !important;
    clip-path: polygon(0 0, 94% 0, 100% 18%, 100% 100%, 0 100%);
  }
  .card-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(212, 175, 55, 0.25);
    padding-bottom: 4px;
  }
  .card-tourney-title {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 11px;
    font-weight: 800;
    color: #d4af37;
    letter-spacing: 1.5px;
  }
  .card-live-tag {
    background: #ef4444;
    color: #ffffff;
    font-size: 10px;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 2px;
    letter-spacing: 1px;
    font-family: 'Chakra Petch', sans-serif;
  }

  .card-main {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #spec-card-logo {
    width: 48px;
    height: 48px;
    border-radius: 4px;
    object-fit: contain;
    background: #000;
    border: 1.5px solid #d4af37;
    flex-shrink: 0;
  }
  .card-info {
    display: flex;
    flex-direction: column;
    justify-content: center;
    line-height: 1;
    overflow: hidden;
  }
  .card-player-label {
    font-size: 11px;
    font-weight: 800;
    color: #8fa0b5;
    letter-spacing: 1px;
  }
  .card-player-name {
    font-family: 'Teko', sans-serif;
    font-size: 26px;
    color: #ffe600;
    letter-spacing: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-team-name {
    font-size: 15px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-top: 1px;
  }

  .card-subbar {
    display: flex;
    justify-content: space-between;
    background: #05070a;
    border: 1px solid rgba(255,255,255,0.08);
    padding: 5px 10px;
    border-radius: 3px;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 11px;
    font-weight: 800;
  }
  .card-subbar .stat-val { color: #5c84ff; }

  .card-bottombar {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    font-weight: 800;
    color: #e5b95c;
    border-top: 1px solid rgba(255,255,255,0.06);
    padding-top: 4px;
    letter-spacing: 1.5px;
    font-family: 'Chakra Petch', sans-serif;
  }
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <audio id="elimination-audio" preload="auto">
    <source src="https://cdn.freesound.org/previews/381/381382_6142149-lq.mp3" type="audio/mpeg">
  </audio>

  <!-- 1. STANDALONE CURRENT MATCH & TIMER BAR (OUTWARD DIAGONAL LEFT SLANT) -->
  <div id="match-timer-dock">
    <div class="header-crest"></div>
    <div class="header-top-lip"></div>
    <div class="match-outer-frame">
      <div class="match-inner-plate">
        <div class="match-pinstripe-box">
          <div class="current-match-block">
            <div class="match-main-title">CURRENT MATCH</div>
            <div class="match-sub-title" id="overlay-match-map">MAP - 1 - BERMUDA</div>
          </div>
          <div class="header-divider-line"></div>
          <div class="timer-block">
            <div class="timer-small-label">MATCH TIME</div>
            <div class="hud-timer-clock" id="timer-display">00:00</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. LEFT LEADERBOARD DOCK -->
  <div class="broadcast-dock">
    <div id="elim-banner">
      <div class="skull-badge">☠</div>
      <img id="banner-logo" src="" alt="logo" />
      <div class="banner-text-box">
        <div class="banner-primary"><span id="banner-team-name">TEAM</span> WIPED</div>
        <div class="banner-tagline">ALL PLAYERS K.I.A</div>
      </div>
    </div>

    <div class="hud-container">
      <div class="hud-header">
        <div class="col-teams">TEAMS</div>
        <div class="col-elims">ELIMS</div>
        <div class="col-alive">ALIVE</div>
      </div>

      <div class="hud-body" id="hud-body"></div>

      <div class="hud-legend">
        <div class="legend-inner">
          <div class="legend-item">
            <span class="legend-box" style="background:#426aef; box-shadow: 0 0 6px #426aef;"></span>
            <span>ALIVE</span>
          </div>
          <div class="legend-item">
            <span class="legend-box" style="background:#141720; border: 1px solid #333;"></span>
            <span>ELIMINATED</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. BOTTOM-RIGHT TOURNAMENT SPECTATOR CARD -->
  <div id="official-spec-card">
    <div class="card-topbar">
      <span class="card-tourney-title">/// FFWS PRO TOURNAMENT ///</span>
      <span class="card-live-tag">LIVE FEED</span>
    </div>

    <div class="card-main">
      <img id="spec-card-logo" src="https://dummyimage.com/48x48/000/d4af37&text=FF" alt="Team Logo" />
      <div class="card-info">
        <span class="card-player-label">PLAYER: <span class="card-player-name" id="spec-player-name">SELECTING...</span></span>
        <span class="card-team-name" id="spec-team-name">WAITING FOR SPECTATE</span>
      </div>
    </div>

    <div class="card-subbar">
      <span>TEAM ELIMS: <span class="stat-val" id="spec-team-kills">0</span></span>
      <span>SQUAD: <span class="stat-val" id="spec-squad-alive">4/4 ALIVE</span></span>
    </div>

    <div class="card-bottombar">
      <span id="spec-card-map-footer">MAP - 1 - BERMUDA</span>
      <span style="color:#5c84ff;">OFFICIAL SPECTATOR CLIENT</span>
    </div>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBRcMrsrifYv-VDsCrTMKZuQiub30a7wEs",
    authDomain: "tournment-leaderboard.firebaseapp.com",
    databaseURL: "https://tournment-leaderboard-default-rtdb.firebaseio.com",
    projectId: "tournment-leaderboard",
    storageBucket: "tournment-leaderboard.firebasestorage.app",
    messagingSenderId: "685244342962",
    appId: "1:685244342962:web:d31c15a67fb9b6161f5fab",
    measurementId: "G-RKSK1ZBC5M"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let cachedTeams = [];
  let previousTeams = [];
  let bannerTimer = null;
  let currentActiveTeamIdx = 0;

  function showEliminationBanner(name, logo) {
    const banner = document.getElementById('elim-banner');
    document.getElementById('banner-team-name').innerText = name || 'UNKNOWN';
    document.getElementById('banner-logo').src = logo || 'https://dummyimage.com/40x40/000/fff&text=#';
    banner.classList.add('show');

    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => banner.classList.remove('show'), 4200);
  }

  // 1. Match & Map Config Listener
  db.ref('esports_data/match_info').on('value', (snap) => {
    const data = snap.val();
    if (data) {
      const matchNum = data.match || "1";
      const mapName = data.map || "BERMUDA";

      document.getElementById('overlay-match-map').innerText = `MAP - ${matchNum} - ${mapName}`;
      const footer = document.getElementById('spec-card-map-footer');
      if (footer) {
        footer.innerText = `MAP - ${matchNum} - ${mapName}`;
      }
    }
  });

  // 2. Teams & Leaderboard Listener
  db.ref('esports_data/teams').on('value', (snapshot) => {
    const teams = snapshot.val();
    if (teams && Array.isArray(teams)) {
      cachedTeams = teams;
      renderOverlay(teams);
      updateSpectatorCard();
    }
  });

  // 3. Active Spectate Team + Player Listener
  db.ref('esports_data/active_spectate').on('value', (snap) => {
    const val = snap.val();
    if (val !== null && typeof val === 'number') {
      currentActiveTeamIdx = val;
      updateSpectatorCard();
    }
  });

  db.ref('esports_data/detected_player').on('value', (snap) => {
    const val = snap.val();
    if (val) {
      document.getElementById('spec-player-name').innerText = val;
    }
  });

  function updateSpectatorCard() {
    if (!cachedTeams || !cachedTeams[currentActiveTeamIdx]) return;
    const team = cachedTeams[currentActiveTeamIdx];

    const teamName = team.name && team.name.trim() !== '' ? team.name : `SLOT ${currentActiveTeamIdx + 1}`;
    const logoUrl = team.logo && team.logo.trim() !== '' ? team.logo : `https://dummyimage.com/48x48/000/d4af37&text=${teamName[0]}`;
    const kills = team.kills || 0;
    const aliveCount = (team.players || []).filter(p => p.status === 'alive').length;

    document.getElementById('spec-card-logo').src = logoUrl;
    document.getElementById('spec-team-name').innerText = teamName;
    document.getElementById('spec-team-kills').innerText = kills;
    document.getElementById('spec-squad-alive').innerText = `${aliveCount}/4 ALIVE`;
  }

  // 4. Timer Listener
  let timerState = { running: false, seconds: 0, startTimestamp: null };
  let localTimerInterval = null;

  db.ref('esports_data/timer').on('value', (snapshot) => {
    const val = snapshot.val();
    if (val) {
      timerState = val;
      updateTimerUI();
    }
  });

  function formatTime(totalSec) {
    const m = String(Math.floor(totalSec / 60)).padStart(2, '0');
    const s = String(totalSec % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  function updateTimerUI() {
    clearInterval(localTimerInterval);
    if (timerState.running && timerState.startTimestamp) {
      localTimerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - timerState.startTimestamp) / 1000);
        document.getElementById('timer-display').innerText = formatTime(elapsed);
      }, 1000);
      const elapsed = Math.floor((Date.now() - timerState.startTimestamp) / 1000);
      document.getElementById('timer-display').innerText = formatTime(elapsed);
    } else {
      document.getElementById('timer-display').innerText = formatTime(timerState.seconds || 0);
    }
  }

  function renderOverlay(teams) {
    if (previousTeams.length > 0) {
      teams.forEach((curr, idx) => {
        const prev = previousTeams[idx];
        if (prev) {
          const prevAlive = (prev.players || []).some(p => p.status !== 'dead');
          const currAlive = (curr.players || []).some(p => p.status !== 'dead');
          if (prevAlive && !currAlive) {
            const label = curr.name && curr.name.trim() !== '' ? curr.name : `SLOT ${idx + 1}`;
            showEliminationBanner(label, curr.logo);
          }
        }
      });
    }
    previousTeams = JSON.parse(JSON.stringify(teams));

    const container = document.getElementById('hud-body');
    container.innerHTML = '';

    const indexedTeams = teams.map((team, index) => ({ ...team, originalIndex: index }));
    indexedTeams.sort((a, b) => {
      const elimsA = Number(a.kills) || 0;
      const elimsB = Number(b.kills) || 0;
      if (elimsB !== elimsA) return elimsB - elimsA;
      return (Number(b.alive) || 0) - (Number(a.alive) || 0);
    });

    indexedTeams.forEach((team, rankIndex) => {
      const elims = Number(team.kills) || 0;
      const players = team.players || [
        { status: 'alive' }, { status: 'alive' },
        { status: 'alive' }, { status: 'alive' }
      ];

      const isEliminated = players.every(p => p.status === 'dead');

      let barsHtml = '';
      players.slice(0, 4).forEach(p => {
        barsHtml += `<div class="bar status-${p.status === 'dead' ? 'dead' : 'alive'}"></div>`;
      });

      const displayName = team.name && team.name.trim() !== '' ? team.name : `SLOT ${team.originalIndex + 1}`;
      const displayLogo = team.logo && team.logo.trim() !== '' ? team.logo : `https://dummyimage.com/24x24/000/426aef&text=${displayName[0]}`;

      container.innerHTML += `
        <div class="hud-row ${isEliminated ? 'eliminated-row' : ''}">
          <div class="team-cell">
            <div class="team-cell-inner">
              <span class="rank-tag">#${rankIndex + 1}</span>
              <img class="team-logo" src="${displayLogo}" />
              <span class="team-name">${displayName}</span>
            </div>
          </div>
          <div class="elims-cell">${elims}</div>
          <div class="alive-cell">
            <div class="alive-bars">${barsHtml}</div>
          </div>
        </div>
      `;
    });
  }
</script>
</body>
</html>

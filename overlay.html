<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pro Broadcast Esports HUD Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Teko:wght@700&family=Rajdhani:wght@700;800&family=Chakra+Petch:wght@700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px;
    height: 1080px;
    background: transparent;
    font-family: 'Rajdhani', sans-serif;
    overflow: hidden;
    user-select: none;
    position: relative;
  }

  /* FLUSH DOCK - DYNAMICALLY EXPANDS WITH LONG NAMES */
  .left-broadcast-dock {
    position: absolute;
    top: 10px;
    left: 0;
    width: fit-content;
    min-width: 320px;
    max-width: 550px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* 1. SQUAD WIPEOUT ALERT BANNER */
  #elim-banner {
    width: 100%;
    background: linear-gradient(135deg, rgba(10, 0, 2, 0.98) 0%, rgba(220, 20, 40, 0.95) 50%, rgba(10, 0, 2, 0.98) 100%);
    border: 2px solid #ff2233;
    border-left: none;
    border-radius: 0 6px 6px 0;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 0 35px rgba(255, 30, 50, 0.85), inset 0 0 15px rgba(255, 50, 50, 0.5);
    transform: translateY(-160%) scale(0.9);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.45s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.3s ease;
    z-index: 1000;
  }
  #elim-banner.show {
    transform: translateY(0) scale(1);
    opacity: 1;
    animation: bannerAlertGlow 1s infinite alternate ease-in-out;
  }

  @keyframes bannerAlertGlow {
    0% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.7); }
    100% { box-shadow: 0 0 45px rgba(255, 0, 0, 1), inset 0 0 20px rgba(255, 255, 255, 0.5); }
  }

  .skull-badge {
    font-size: 34px;
    line-height: 1;
    filter: drop-shadow(0 0 10px #ff0033);
    animation: skullShock 0.25s infinite alternate ease-in-out;
  }
  @keyframes skullShock {
    0% { transform: rotate(-6deg) scale(1); }
    100% { transform: rotate(6deg) scale(1.15); }
  }

  #banner-logo {
    width: 44px;
    height: 44px;
    border-radius: 4px;
    object-fit: contain;
    border: 2px solid #ff2233;
    background: #000;
    flex-shrink: 0;
  }

  .banner-text-box {
    display: flex;
    flex-direction: column;
    justify-content: center;
    line-height: 0.95;
    white-space: nowrap;
  }
  .banner-primary {
    font-family: 'Teko', sans-serif;
    font-size: 32px;
    letter-spacing: 1px;
    color: #ffffff;
    text-transform: uppercase;
  }
  .banner-primary span {
    color: #ffe600;
    font-size: 35px;
    text-shadow: 0 0 15px rgba(255, 230, 0, 0.8);
  }
  .banner-tagline {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 11px;
    font-weight: 800;
    color: #ff9999;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* 2. LEADERBOARD HUD - AUTO EXPANDS */
  .hud-container {
    width: 100%;
    display: flex;
    flex-direction: column;
    box-shadow: 0 12px 35px rgba(0,0,0,0.9);
    border: 2px solid #426aef;
    border-left: none;
    border-radius: 0 6px 6px 0;
    overflow: hidden;
  }

  /* Match Timer Bar */
  .hud-timer-bar {
    background: #000000;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 14px;
    border-bottom: 2px solid rgba(66, 106, 239, 0.4);
  }
  .hud-timer-label {
    font-size: 13px;
    font-weight: 800;
    color: #8fa0b5;
    letter-spacing: 1.5px;
  }
  .hud-timer-clock {
    font-size: 20px;
    font-weight: 800;
    color: #426aef;
    font-family: 'Chakra Petch', sans-serif;
    letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(66, 106, 239, 0.7);
  }

  /* Header - Auto Resizing Columns */
  .hud-header {
    background: #426aef;
    color: #ffffff;
    display: grid;
    grid-template-columns: 1fr 60px 75px;
    align-items: center;
    padding: 6px 12px;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 1px;
  }
  .hud-header .col-teams { text-align: left; padding-left: 20px; }
  .hud-header .col-elims { text-align: center; }
  .hud-header .col-alive { text-align: center; }

  /* Leaderboard Rows */
  .hud-body {
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: #000000;
  }

  .hud-row {
    background: #0a0d14;
    border-left: 4px solid #426aef;
    display: grid;
    grid-template-columns: 1fr 60px 75px;
    align-items: center;
    padding: 4px 10px;
    min-height: 38px;
    position: relative;
    overflow: hidden;
    transition: background 0.25s ease;
  }

  /* Eliminated Team Row */
  .hud-row.eliminated-row {
    background: #000000 !important;
    border-left-color: #1a1a1a !important;
  }
  .hud-row.eliminated-row .team-name { color: #3b4252 !important; }
  .hud-row.eliminated-row .rank-tag { color: #2d3340 !important; }
  .hud-row.eliminated-row .elims-cell { color: #3b4252 !important; }
  .hud-row.eliminated-row .team-logo { filter: grayscale(1) opacity(0.2); }

  /* Red Shock Laser Sweep */
  .hud-row.just-vanished {
    animation: rowGlitchShake 0.4s ease-out;
  }
  .hud-row.just-vanished::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      90deg, 
      transparent 0%, 
      rgba(220, 38, 38, 0.4) 30%, 
      #ffffff 65%, 
      #ff1133 100%
    );
    box-shadow: 0 0 35px #ff1133;
    animation: sweepRedVanish 0.85s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    pointer-events: none;
  }

  @keyframes sweepRedVanish {
    0% { left: -100%; opacity: 1; }
    60% { left: 100%; opacity: 0.95; }
    100% { left: 130%; opacity: 0; }
  }

  @keyframes rowGlitchShake {
    0% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-2px); }
    80% { transform: translateX(2px); }
    100% { transform: translateX(0); }
  }

  /* Team Identifiers - No Word Truncation / No Dots */
  .team-cell {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-right: 12px;
  }
  .rank-tag {
    color: #426aef;
    font-size: 17px;
    font-weight: 800;
    min-width: 18px;
    text-align: right;
    font-family: 'Chakra Petch', sans-serif;
    flex-shrink: 0;
  }
  .team-logo {
    width: 24px;
    height: 24px;
    object-fit: contain;
    border-radius: 3px;
    background: #000;
    flex-shrink: 0;
  }
  .team-name {
    font-weight: 800;
    font-size: 21px;
    color: #ffffff;
    white-space: nowrap;
    letter-spacing: 0.8px;
    line-height: 1;
  }

  /* Elimination Numbers */
  .elims-cell {
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    color: #ffffff;
    border-left: 1px solid rgba(255, 255, 255, 0.12);
    border-right: 1px solid rgba(255, 255, 255, 0.12);
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Chakra Petch', sans-serif;
  }

  /* Alive Status Indicators */
  .alive-bars {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
    padding: 0 4px;
  }
  .bar {
    width: 6px;
    height: 21px;
    border-radius: 1px;
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  .bar.status-alive {
    background: #426aef;
    box-shadow: 0 0 6px rgba(66, 106, 239, 0.7);
  }
  .bar.status-dead {
    background: #141720;
    box-shadow: none;
    border: 1px solid #1e2433;
  }

  /* Legend Footer - Full Spelled-Out Text */
  .hud-legend {
    background: #000000;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.8px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .legend-box {
    width: 9px;
    height: 9px;
    border-radius: 1px;
    display: inline-block;
  }
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- FLUSH DOCKED TO LEFT EDGE WITH EXPANDING WIDTH -->
  <div class="left-broadcast-dock">

    <!-- SQUAD WIPEOUT ALERT -->
    <div id="elim-banner">
      <div class="skull-badge">☠</div>
      <img id="banner-logo" src="" alt="logo" />
      <div class="banner-text-box">
        <div class="banner-primary"><span id="banner-team-name">TEAM</span> SQUAD WIPED</div>
        <div class="banner-tagline">ALL PLAYERS K.I.A</div>
      </div>
    </div>

    <!-- MAIN LEADERBOARD HUD -->
    <div class="hud-container">
      <!-- Match Duration -->
      <div class="hud-timer-bar">
        <span class="hud-timer-label">MATCH TIME</span>
        <span class="hud-timer-clock" id="timer-display">00:00</span>
      </div>

      <!-- Header -->
      <div class="hud-header">
        <span class="col-teams">TEAMS</span>
        <span class="col-elims">ELIMS</span>
        <span class="col-alive">ALIVE</span>
      </div>

      <div class="hud-body" id="hud-body"></div>

      <!-- Legend Footer (Cleanly Spelled Out) -->
      <div class="hud-legend">
        <div class="legend-item">
          <span class="legend-box" style="background:#426aef; box-shadow: 0 0 6px #426aef;"></span>
          <span>ALIVE</span>
        </div>
        <div class="legend-item">
          <span class="legend-box" style="background:#141720; border: 1px solid #333;"></span>
          <span>ELIMINATED</span>
        </div>
      </div>
    </div>

  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBRcMrsrifYv-VDsCrTMKZuQiub30a7wEs",
    authDomain: "tournment-leaderboard.firebaseapp.com",
    databaseURL: "https://tournment-leaderboard-default-rtdb.firebaseio.com",
    projectId: "tournment-leaderboard",
    storageBucket: "tournment-leaderboard.firebasestorage.app",
    messagingSenderId: "685244342962",
    appId: "1:685244342962:web:d31c15a67fb9b6161f5fab",
    measurementId: "G-RKSK1ZBC5M"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let previousTeams = [];
  let bannerTimer = null;
  const justVaporizedTeams = new Set();

  function playEliminationAudio() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(32, audioCtx.currentTime + 0.45);

      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.55);
    } catch (e) {}
  }

  function showEliminationBanner(name, logo) {
    playEliminationAudio();

    const banner = document.getElementById('elim-banner');
    const teamSpan = document.getElementById('banner-team-name');
    const bLogo = document.getElementById('banner-logo');

    teamSpan.innerText = name || 'UNKNOWN';
    bLogo.src = logo || ('https://dummyimage.com/44x44/000/fff&text=' + (name ? name[0] : '#'));
    banner.classList.add('show');

    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => {
      banner.classList.remove('show');
    }, 4200);
  }

  db.ref('esports_data/teams').on('value', (snapshot) => {
    const teams = snapshot.val();
    if (teams && Array.isArray(teams)) renderOverlay(teams);
  });

  let timerState = { running: false, seconds: 0, startTimestamp: null };
  let localTimerInterval = null;

  db.ref('esports_data/timer').on('value', (snapshot) => {
    const val = snapshot.val();
    if (val) {
      timerState = val;
      updateTimerUI();
    }
  });

  function formatTime(totalSec) {
    const m = String(Math.floor(totalSec / 60)).padStart(2, '0');
    const s = String(totalSec % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  function updateTimerUI() {
    clearInterval(localTimerInterval);
    if (timerState.running && timerState.startTimestamp) {
      localTimerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - timerState.startTimestamp) / 1000);
        document.getElementById('timer-display').innerText = formatTime(elapsed);
      }, 1000);
      const elapsed = Math.floor((Date.now() - timerState.startTimestamp) / 1000);
      document.getElementById('timer-display').innerText = formatTime(elapsed);
    } else {
      document.getElementById('timer-display').innerText = formatTime(timerState.seconds || 0);
    }
  }

  function renderOverlay(teams) {
    if (previousTeams.length > 0) {
      teams.forEach(curr => {
        const prev = previousTeams.find(p => p.name === curr.name);
        if (prev) {
          const prevAlive = (prev.players || []).some(p => p.status !== 'dead');
          const currAlive = (curr.players || []).some(p => p.status !== 'dead');
          if (prevAlive && !currAlive) {
            showEliminationBanner(curr.name, curr.logo);
            justVaporizedTeams.add(curr.name);
            setTimeout(() => {
              justVaporizedTeams.delete(curr.name);
            }, 1000);
          }
        }
      });
    }
    previousTeams = JSON.parse(JSON.stringify(teams));

    const container = document.getElementById('hud-body');
    container.innerHTML = '';

    const sorted = [...teams].sort((a, b) => {
      const elimsA = Number(a.kills) || 0;
      const elimsB = Number(b.kills) || 0;
      if (elimsB !== elimsA) return elimsB - elimsA;
      return (Number(b.alive) || 0) - (Number(a.alive) || 0);
    });

    sorted.forEach((team, index) => {
      const elims = Number(team.kills) || 0;
      const players = team.players || [
        { status: 'alive' }, { status: 'alive' },
        { status: 'alive' }, { status: 'alive' }
      ];

      const isEliminated = players.every(p => p.status === 'dead');
      const isVaporizing = justVaporizedTeams.has(team.name);

      let barsHtml = '';
      players.slice(0, 4).forEach(p => {
        barsHtml += `<div class="bar status-${p.status === 'dead' ? 'dead' : 'alive'}"></div>`;
      });

      container.innerHTML += `
        <div class="hud-row ${isEliminated ? 'eliminated-row' : ''} ${isVaporizing ? 'just-vanished' : ''}">
          <div class="team-cell">
            <span class="rank-tag">#${index + 1}</span>
            <img class="team-logo" src="${team.logo || 'https://dummyimage.com/24x24/000/426aef&text=' + (team.name ? team.name[0] : '#')}" />
            <span class="team-name">${team.name || 'SLOT'}</span>
          </div>
          <div class="elims-cell">${elims}</div>
          <div class="alive-bars">${barsHtml}</div>
        </div>
      `;
    });
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OBS Esports HUD Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Rajdhani:wght@700;800&family=Chakra+Petch:wght@700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    font-family: 'Rajdhani', sans-serif;
    padding: 24px;
    overflow: hidden;
    user-select: none;
  }

  /* 1. ULTRA OP CINEMATIC ELIMINATION BANNER */
  #elim-banner {
    position: fixed;
    top: 35px;
    left: 50%;
    transform: translateX(-50%) translateY(-250%) scale(0.7);
    width: 760px;
    background: linear-gradient(135deg, rgba(20, 5, 8, 0.98) 0%, rgba(185, 28, 28, 0.95) 50%, rgba(15, 3, 5, 0.98) 100%);
    border-top: 3px solid #ff4444;
    border-bottom: 4px solid #ff1111;
    clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%);
    padding: 16px 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    box-shadow: 0 0 60px rgba(255, 20, 20, 0.9), inset 0 0 30px rgba(255, 50, 50, 0.5);
    transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.3s ease;
    opacity: 0;
    z-index: 99999;
  }
  #elim-banner.show {
    transform: translateX(-50%) translateY(0) scale(1);
    opacity: 1;
    animation: bannerPulse 1.2s infinite alternate ease-in-out;
  }

  @keyframes bannerPulse {
    0% { box-shadow: 0 0 40px rgba(255, 0, 0, 0.75); }
    100% { box-shadow: 0 0 75px rgba(255, 30, 30, 1), inset 0 0 35px rgba(255, 255, 255, 0.4); }
  }

  #elim-banner::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: -100%;
    width: 100%;
    height: 4px;
    background: linear-gradient(90deg, transparent, #ffffff, #ff0033, transparent);
    animation: laserScan 1.4s infinite linear;
  }
  @keyframes laserScan {
    0% { left: -100%; }
    100% { left: 100%; }
  }

  .skull-badge {
    font-size: 48px;
    line-height: 1;
    filter: drop-shadow(0 0 12px #ff0033);
    animation: skullShake 0.4s infinite alternate ease-in-out;
  }
  @keyframes skullShake {
    0% { transform: rotate(-4deg) scale(1); }
    100% { transform: rotate(4deg) scale(1.08); }
  }

  #elim-banner img {
    width: 68px;
    height: 68px;
    border-radius: 6px;
    object-fit: contain;
    border: 2px solid #ff4444;
    background: #000;
    box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
  }

  .banner-content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    line-height: 0.95;
  }
  .banner-title {
    font-family: 'Teko', sans-serif;
    font-size: 54px;
    letter-spacing: 2px;
    color: #ffffff;
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(0,0,0,0.9), 2px 2px 0 #000;
  }
  .banner-title span {
    color: #ffe600;
    text-shadow: 0 0 20px rgba(255, 230, 0, 0.9);
    font-size: 58px;
  }
  .banner-sub {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 15px;
    font-weight: 800;
    color: #ff9999;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* 2. SUPER SIZED HUD CONTAINER */
  .hud-container {
    width: 390px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 15px 40px rgba(0,0,0,0.95);
    border: 2px solid #426aef;
    border-radius: 8px 8px 0 0;
    overflow: hidden;
  }

  /* Match Timer Bar */
  .hud-timer-bar {
    background: #000000;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 16px;
    border-bottom: 2px solid rgba(66, 106, 239, 0.4);
  }
  .hud-timer-label {
    font-size: 14px;
    font-weight: 800;
    color: #94a3b8;
    letter-spacing: 1.5px;
  }
  .hud-timer-clock {
    font-size: 22px;
    font-weight: 800;
    color: #426aef;
    font-family: 'Chakra Petch', sans-serif;
    letter-spacing: 1px;
    text-shadow: 0 0 12px rgba(66, 106, 239, 0.7);
  }

  /* Header */
  .hud-header {
    background: #426aef;
    color: #ffffff;
    display: grid;
    grid-template-columns: 190px 75px 1fr;
    align-items: center;
    padding: 7px 12px;
    font-weight: 800;
    font-size: 17px;
    letter-spacing: 1px;
  }
  .hud-header .col-teams { text-align: left; padding-left: 36px; }
  .hud-header .col-elims { text-align: center; }
  .hud-header .col-alive { text-align: center; }

  /* Leaderboard Body */
  .hud-body {
    display: flex;
    flex-direction: column;
    gap: 2px;
    background: #000000;
  }

  /* Active Team Row */
  .hud-row {
    background: #0a0d14;
    border-left: 5px solid #426aef;
    display: grid;
    grid-template-columns: 190px 75px 1fr;
    align-items: center;
    padding: 6px 10px;
    min-height: 44px;
    position: relative;
    overflow: hidden;
    transition: background 0.25s ease;
  }

  /* Eliminated Team Row */
  .hud-row.eliminated-row {
    background: #000000 !important;
    border-left-color: #1a1a1a !important;
  }
  .hud-row.eliminated-row .team-name { color: #3b4252 !important; text-shadow: none !important; }
  .hud-row.eliminated-row .rank-tag { color: #2d3340 !important; }
  .hud-row.eliminated-row .elims-cell { color: #3b4252 !important; text-shadow: none !important; }
  .hud-row.eliminated-row .team-logo { filter: grayscale(1) opacity(0.2); }

  /* Red Laser Wipeout */
  .hud-row.just-vanished::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      90deg, 
      transparent 0%, 
      rgba(220, 38, 38, 0.4) 30%, 
      #ffffff 65%, 
      #ef4444 100%
    );
    box-shadow: 0 0 35px #ef4444;
    animation: sweepRedVanish 0.95s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    pointer-events: none;
  }

  @keyframes sweepRedVanish {
    0% { left: -100%; opacity: 1; }
    60% { left: 100%; opacity: 0.95; }
    100% { left: 130%; opacity: 0; }
  }

  /* Team Identifiers - Super Sized */
  .team-cell {
    display: flex;
    align-items: center;
    gap: 10px;
    overflow: hidden;
  }
  .rank-tag {
    color: #426aef;
    font-size: 19px;
    font-weight: 800;
    min-width: 22px;
    text-align: right;
    font-family: 'Chakra Petch', sans-serif;
  }
  .team-logo {
    width: 28px;
    height: 28px;
    object-fit: contain;
    border-radius: 3px;
    background: #000;
  }
  .team-name {
    font-weight: 800;
    font-size: 22px;
    color: #ffffff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.8px;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
  }

  /* Big Elims Column */
  .elims-cell {
    text-align: center;
    font-size: 24px;
    font-weight: 800;
    color: #ffffff;
    border-left: 2px solid rgba(255, 255, 255, 0.1);
    border-right: 2px solid rgba(255, 255, 255, 0.1);
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Chakra Petch', sans-serif;
    text-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
  }

  /* Thick Alive Status Indicators */
  .alive-bars {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
    padding: 0 6px;
  }
  .bar {
    width: 8px;
    height: 26px;
    border-radius: 2px;
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  .bar.status-alive {
    background: #426aef;
    box-shadow: 0 0 8px rgba(66, 106, 239, 0.8), inset 0 0 4px rgba(255, 255, 255, 0.4);
  }
  .bar.status-dead {
    background: #141720;
    box-shadow: none;
    border: 1px solid #1e2433;
  }

  /* Legend Footer */
  .hud-legend {
    background: #000000;
    border-top: 2px solid rgba(255, 255, 255, 0.12);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    padding: 8px 10px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.8px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .legend-box {
    width: 12px;
    height: 12px;
    border-radius: 2px;
    display: inline-block;
  }
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- ULTRA OP CINEMATIC ELIMINATION BANNER -->
  <div id="elim-banner">
    <div class="skull-badge">☠</div>
    <img id="banner-logo" src="" alt="logo" />
    <div class="banner-content">
      <div class="banner-title"><span id="banner-team-name">TEAM</span> SQUAD ELIMINATED</div>
      <div class="banner-sub">ALL SQUAD MEMBERS K.I.A • WIPED OUT</div>
    </div>
  </div>

  <!-- Main Tournament HUD -->
  <div class="hud-container">
    <!-- Match Timer -->
    <div class="hud-timer-bar">
      <span class="hud-timer-label">MATCH DURATION</span>
      <span class="hud-timer-clock" id="timer-display">00:00</span>
    </div>

    <!-- Blue Header -->
    <div class="hud-header">
      <span class="col-teams">TEAMS</span>
      <span class="col-elims">ELIMS</span>
      <span class="col-alive">ALIVE</span>
    </div>

    <div class="hud-body" id="hud-body"></div>

    <!-- Footer Legend -->
    <div class="hud-legend">
      <div class="legend-item">
        <span class="legend-box" style="background:#426aef; box-shadow: 0 0 6px #426aef;"></span>
        <span>ALIVE</span>
      </div>
      <div class="legend-item">
        <span class="legend-box" style="background:#141720; border: 1px solid #333;"></span>
        <span>ELIMINATED</span>
      </div>
    </div>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBRcMrsrifYv-VDsCrTMKZuQiub30a7wEs",
    authDomain: "tournment-leaderboard.firebaseapp.com",
    databaseURL: "https://tournment-leaderboard-default-rtdb.firebaseio.com",
    projectId: "tournment-leaderboard",
    storageBucket: "tournment-leaderboard.firebasestorage.app",
    messagingSenderId: "685244342962",
    appId: "1:685244342962:web:d31c15a67fb9b6161f5fab",
    measurementId: "G-RKSK1ZBC5M"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let previousTeams = [];
  let bannerTimer = null;
  const justVaporizedTeams = new Set();

  function showEliminationBanner(name, logo) {
    const banner = document.getElementById('elim-banner');
    const teamSpan = document.getElementById('banner-team-name');
    const bLogo = document.getElementById('banner-logo');

    teamSpan.innerText = name || 'UNKNOWN';
    bLogo.src = logo || ('https://dummyimage.com/68x68/000/fff&text=' + (name ? name[0] : '#'));
    banner.classList.add('show');

    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => {
      banner.classList.remove('show');
    }, 4200);
  }

  // Real-time Database Sync
  db.ref('esports_data/teams').on('value', (snapshot) => {
    const teams = snapshot.val();
    if (teams && Array.isArray(teams)) renderOverlay(teams);
  });

  // Timer Sync
  let timerState = { running: false, seconds: 0, startTimestamp: null };
  let localTimerInterval = null;

  db.ref('esports_data/timer').on('value', (snapshot) => {
    const val = snapshot.val();
    if (val) {
      timerState = val;
      updateTimerUI();
    }
  });

  function formatTime(totalSec) {
    const m = String(Math.floor(totalSec / 60)).padStart(2, '0');
    const s = String(totalSec % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  function updateTimerUI() {
    clearInterval(localTimerInterval);
    if (timerState.running && timerState.startTimestamp) {
      localTimerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - timerState.startTimestamp) / 1000);
        document.getElementById('timer-display').innerText = formatTime(elapsed);
      }, 1000);
      const elapsed = Math.floor((Date.now() - timerState.startTimestamp) / 1000);
      document.getElementById('timer-display').innerText = formatTime(elapsed);
    } else {
      document.getElementById('timer-display').innerText = formatTime(timerState.seconds || 0);
    }
  }

  function renderOverlay(teams) {
    // Detect newly eliminated squads
    if (previousTeams.length > 0) {
      teams.forEach(curr => {
        const prev = previousTeams.find(p => p.name === curr.name);
        if (prev) {
          const prevAlive = (prev.players || []).some(p => p.status !== 'dead');
          const currAlive = (curr.players || []).some(p => p.status !== 'dead');
          if (prevAlive && !currAlive) {
            showEliminationBanner(curr.name, curr.logo);
            justVaporizedTeams.add(curr.name);
            setTimeout(() => {
              justVaporizedTeams.delete(curr.name);
            }, 1000);
          }
        }
      });
    }
    previousTeams = JSON.parse(JSON.stringify(teams));

    const container = document.getElementById('hud-body');
    container.innerHTML = '';

    // Sort by elims descending
    const sorted = [...teams].sort((a, b) => {
      const elimsA = Number(a.kills) || 0;
      const elimsB = Number(b.kills) || 0;
      if (elimsB !== elimsA) return elimsB - elimsA;
      return (Number(b.alive) || 0) - (Number(a.alive) || 0);
    });

    sorted.forEach((team, index) => {
      const elims = Number(team.kills) || 0;
      const players = team.players || [
        { status: 'alive' }, { status: 'alive' },
        { status: 'alive' }, { status: 'alive' }
      ];

      const isEliminated = players.every(p => p.status === 'dead');
      const isVaporizing = justVaporizedTeams.has(team.name);

      let barsHtml = '';
      players.slice(0, 4).forEach(p => {
        barsHtml += `<div class="bar status-${p.status === 'dead' ? 'dead' : 'alive'}"></div>`;
      });

      container.innerHTML += `
        <div class="hud-row ${isEliminated ? 'eliminated-row' : ''} ${isVaporizing ? 'just-vanished' : ''}">
          <div class="team-cell">
            <span class="rank-tag">#${index + 1}</span>
            <img class="team-logo" src="${team.logo || 'https://dummyimage.com/28x28/000/426aef&text=' + (team.name ? team.name[0] : '#')}" />
            <span class="team-name">${team.name || 'SLOT'}</span>
          </div>
          <div class="elims-cell">${elims}</div>
          <div class="alive-bars">${barsHtml}</div>
        </div>
      `;
    });
  }
</script>
</body>
</html>

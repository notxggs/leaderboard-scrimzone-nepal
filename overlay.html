<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Chakra+Petch:wght@600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    font-family: 'Chakra Petch', sans-serif;
    color: #fff;
    padding: 10px;
    overflow: hidden;
    user-select: none;
  }

  /* Top Elimination Alert Banner */
  #elim-banner {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%) translateY(-140%);
    background: linear-gradient(90deg, #d92d20 0%, #15161c 100%);
    border: 2px solid #ff3b30;
    border-radius: 6px;
    padding: 8px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 6px 25px rgba(0, 0, 0, 0.8);
    transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 999;
  }
  #elim-banner.show { transform: translateX(-50%) translateY(0); }
  #elim-banner img { width: 28px; height: 28px; border-radius: 4px; object-fit: cover; }
  #elim-banner .banner-text {
    font-family: 'Teko', sans-serif;
    font-size: 26px;
    letter-spacing: 1px;
    color: #fff;
    line-height: 1;
    text-transform: uppercase;
  }

  /* Solid Dark Leaderboard Container */
  .leaderboard {
    width: 340px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-top: 50px;
    background: #0f1015; /* Solid dark background - zero bleed */
    padding: 10px 8px;
    border-radius: 6px;
    border: 1px solid #232530;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
  }

  /* Header with Solid Dark Strip */
  .board-header {
    display: grid;
    grid-template-columns: 32px 1fr 34px 34px 44px;
    align-items: center;
    padding: 6px 8px;
    font-size: 11px;
    font-weight: 700;
    color: #8b90a0;
    text-transform: uppercase;
    background: #171821;
    border-radius: 4px;
    margin-bottom: 4px;
  }
  .board-header span { text-align: center; }
  .board-header .head-team { text-align: left; padding-left: 28px; }

  /* Active Team Row */
  .team-row {
    display: grid;
    grid-template-columns: 32px 1fr 34px 34px 44px;
    align-items: center;
    background: #1b1d24; /* Solid black/charcoal */
    border-left: 4px solid #484b57;
    padding: 5px 8px;
    border-radius: 0 4px 4px 0;
    font-size: 13px;
    transition: all 0.25s ease;
  }

  /* Rank Highlighting */
  .team-row.rank-1 {
    border-left-color: #ffb800;
    background: linear-gradient(90deg, #2e2305 0%, #1b1d24 100%);
  }
  .team-row.rank-2 { border-left-color: #ffd043; }
  .team-row.rank-3 { border-left-color: #f7941d; }

  .rank-num {
    font-family: 'Teko', sans-serif;
    font-size: 19px;
    line-height: 1;
    color: #ffb800;
    text-align: center;
    font-weight: 700;
  }

  .team-identity {
    display: flex;
    align-items: center;
    gap: 8px;
    overflow: hidden;
  }
  .team-logo {
    width: 20px;
    height: 20px;
    border-radius: 3px;
    object-fit: cover;
    background: #000;
  }
  .team-name {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    color: #ffffff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .elims {
    font-family: 'Teko', sans-serif;
    font-size: 21px;
    line-height: 1;
    color: #ffffff;
    text-align: center;
  }

  .total-pts {
    font-family: 'Teko', sans-serif;
    font-size: 21px;
    line-height: 1;
    color: #ffb800;
    text-align: center;
    font-weight: 700;
  }

  .status-bars {
    display: flex;
    gap: 3px;
    justify-content: flex-end;
  }
  .bar {
    width: 4.5px;
    height: 15px;
    border-radius: 1px;
    background: #ffb800; /* Alive = Bright Gold */
  }
  .bar.dead {
    background: #2b2e3a; /* Eliminated slot */
  }

  /* ELIMINATED/DEAD TEAMS (Dark charcoal style without turning white) */
  .team-row.wiped {
    background: #111216 !important;
    border-left-color: #292a33 !important;
  }
  .team-row.wiped .rank-num { color: #525663; }
  .team-row.wiped .team-name { color: #626674; }
  .team-row.wiped .elims { color: #626674; }
  .team-row.wiped .total-pts { color: #736b4a; }
  .team-row.wiped .team-logo { opacity: 0.35; filter: grayscale(1); }
  .team-row.wiped .bar { background: #22242d !important; }
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div id="elim-banner">
    <img id="banner-logo" src="" alt="logo" />
    <div class="banner-text" id="banner-text">TEAM ELIMINATED</div>
  </div>

  <div class="leaderboard">
    <div class="board-header">
      <span>#</span>
      <span class="head-team">Teams</span>
      <span>Elim</span>
      <span>Tot</span>
      <span style="text-align:right;">Status</span>
    </div>
    <div id="board-body" style="display:flex; flex-direction:column; gap:3px;"></div>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBRcMrsrifYv-VDsCrTMKZuQiub30a7wEs",
    authDomain: "tournment-leaderboard.firebaseapp.com",
    databaseURL: "https://tournment-leaderboard-default-rtdb.firebaseio.com",
    projectId: "tournment-leaderboard",
    storageBucket: "tournment-leaderboard.firebasestorage.app",
    messagingSenderId: "685244342962",
    appId: "1:685244342962:web:d31c15a67fb9b6161f5fab",
    measurementId: "G-RKSK1ZBC5M"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let currentTeams = [];
  let bannerTimeout = null;

  function triggerElimBanner(teamName, teamLogo) {
    const banner = document.getElementById('elim-banner');
    const bText = document.getElementById('banner-text');
    const bLogo = document.getElementById('banner-logo');

    bText.innerText = `${teamName} SQUAD ELIMINATED`;
    bLogo.src = teamLogo || 'https://dummyimage.com/28x28/000/fff&text=' + teamName[0];
    banner.classList.add('show');

    clearTimeout(bannerTimeout);
    bannerTimeout = setTimeout(() => {
      banner.classList.remove('show');
    }, 3800);
  }

  function render(teams) {
    if (!teams || !Array.isArray(teams)) return;

    if (currentTeams.length > 0) {
      teams.forEach(t => {
        const prev = currentTeams.find(p => p.name === t.name);
        if (prev && prev.alive > 0 && t.alive === 0) {
          triggerElimBanner(t.name, t.logo);
        }
      });
    }
    currentTeams = JSON.parse(JSON.stringify(teams));

    const sorted = [...teams].sort((a, b) => {
      const totA = Number(a.kills) + Number(a.placement || 0);
      const totB = Number(b.kills) + Number(b.placement || 0);
      if (totB !== totA) return totB - totA;
      return b.kills - a.kills;
    });

    const body = document.getElementById('board-body');
    body.innerHTML = '';

    sorted.forEach((team, idx) => {
      const matchKills = Number(team.kills) || 0;
      const totalOverallPoints = matchKills + (Number(team.placement) || 0);
      const isWiped = team.alive === 0;

      let barsHtml = '';
      for (let i = 0; i < 4; i++) {
        barsHtml += `<div class="bar ${i < team.alive ? '' : 'dead'}"></div>`;
      }

      const rankClass = idx === 0 ? 'rank-1' : (idx === 1 ? 'rank-2' : (idx === 2 ? 'rank-3' : ''));

      body.innerHTML += `
        <div class="team-row ${rankClass} ${isWiped ? 'wiped' : ''}">
          <span class="rank-num">#${idx + 1}</span>
          <div class="team-identity">
            <img class="team-logo" src="${team.logo || 'https://dummyimage.com/20x20/000000/ffb800&text=' + team.name[0]}" />
            <span class="team-name">${team.name}</span>
          </div>
          <span class="elims">${matchKills}</span>
          <span class="total-pts">${totalOverallPoints}</span>
          <div class="status-bars">${barsHtml}</div>
        </div>
      `;
    });
  }

  db.ref('esports_data/teams').on('value', (snapshot) => {
    const val = snapshot.val();
    if (val) render(val);
  });

  db.ref('esports_data/resetSignal').on('value', () => {
    const banner = document.getElementById('elim-banner');
    if (banner) banner.classList.remove('show');
  });
</script>
</body>
</html>

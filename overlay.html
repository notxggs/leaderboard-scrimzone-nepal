<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScrimZone Nepal — OBS Live Overlay</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Rajdhani:wght@600;700;800&family=Inter:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: 'Rajdhani', sans-serif;
      color: #fff;
      overflow: hidden;
      width: 1920px;
      height: 1080px;
      position: relative;
    }

    /* ═══════════════════════════════════════════════════
       ESPORTS TOP HUD BADGE
    ════════════════════════════════════════════════════ */
    .hud-wrapper {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hud-crown {
      width: 220px;
      height: 10px;
      background: linear-gradient(180deg, #ffd54f 0%, #b8860b 100%);
      clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
      border: 1px solid #ffe082;
      border-bottom: none;
      box-shadow: 0 0 10px rgba(255, 213, 79, 0.4);
    }

    .hud-card {
      position: relative;
      display: flex;
      align-items: stretch;
      background: linear-gradient(180deg, #0d1522 0%, #080d15 100%);
      border: 2px solid #d4af37;
      border-radius: 4px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.9), inset 0 0 15px rgba(212, 175, 55, 0.15);
      padding: 6px 14px;
      min-width: 480px;
    }

    .hud-card::before, .hud-card::after {
      content: '';
      position: absolute;
      width: 6px;
      height: 6px;
      border: 1px solid #ffe082;
    }
    .hud-card::before { top: 2px; left: 2px; border-right: none; border-bottom: none; }
    .hud-card::after { bottom: 2px; right: 2px; border-left: none; border-top: none; }

    .hud-match-sec {
      flex: 1.4;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 16px;
    }

    .hud-title {
      font-family: 'Teko', sans-serif;
      font-size: 38px;
      letter-spacing: 2px;
      line-height: 0.9;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .hud-sub {
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      font-weight: 800;
      color: #ffca28;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .hud-divider {
      width: 1px;
      background: linear-gradient(180deg, transparent 0%, rgba(212, 175, 55, 0.6) 50%, transparent 100%);
      margin: 4px 0;
    }

    .hud-timer-sec {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 18px;
    }

    .timer-label {
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      font-weight: 800;
      color: #90a4ae;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 2px;
    }

    .timer-num {
      font-family: 'Teko', sans-serif;
      font-size: 46px;
      letter-spacing: 2px;
      line-height: 0.85;
      color: #64b5f6;
      text-shadow: 0 0 15px rgba(100, 181, 246, 0.4);
    }

    /* ═══════════════════════════════════════════════════
       LEFT SIDEBAR: PLAYING TEAMS LEADERBOARD
    ════════════════════════════════════════════════════ */
    .leaderboard {
      position: absolute;
      top: 130px;
      left: 40px;
      width: 320px;
      background: rgba(10, 14, 22, 0.95);
      border: 2px solid #1f2b40;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(0,0,0,0.85);
    }

    .board-header {
      background: linear-gradient(90deg, #1565c0 0%, #0d47a1 100%);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #ffd54f;
    }

    .board-title {
      font-family: 'Teko', sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .board-time {
      font-size: 12px;
      font-weight: 800;
      background: rgba(0,0,0,0.4);
      padding: 2px 8px;
      border-radius: 4px;
      color: #ffca28;
    }

    .team-row {
      display: flex;
      align-items: center;
      padding: 7px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: 0.2s ease;
    }
    .team-row:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
    .team-row.focused {
      background: rgba(255, 152, 0, 0.25);
      border-left: 4px solid #ff9800;
    }

    .team-idx {
      font-family: 'Teko', sans-serif;
      font-size: 22px;
      color: #ff9800;
      width: 28px;
    }

    .team-logo {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      object-fit: cover;
      margin-right: 10px;
      border: 1px solid #1f2b40;
      background: #090e17;
    }

    .team-name {
      font-size: 13px;
      font-weight: 700;
      flex-grow: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
    }

    .booyah-badge {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 12px;
      font-weight: 800;
      color: #ffca28;
    }
  </style>
</head>
<body>

  <!-- Top Esports Match Banner -->
  <div class="hud-wrapper">
    <div class="hud-crown"></div>
    <div class="hud-card">
      <div class="hud-match-sec">
        <div class="hud-title">CURRENT MATCH</div>
        <div class="hud-sub" id="map-display">MAP - 1 - BERMUDA</div>
      </div>
      <div class="hud-divider"></div>
      <div class="hud-timer-sec">
        <div class="timer-label">MATCH TIME</div>
        <div class="timer-num" id="timer-display">00:00</div>
      </div>
    </div>
  </div>

  <!-- Left Sidebar Playing Teams -->
  <div class="leaderboard">
    <div class="board-header">
      <span class="board-title">PLAYING TEAMS</span>
      <span class="board-time">LIVE LOBBY</span>
    </div>
    <div id="teams-list"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBRcMrsrifYv-VDsCrTMKZuQiub30a7wEs",
      authDomain: "tournment-leaderboard.firebaseapp.com",
      databaseURL: "https://tournment-leaderboard-default-rtdb.firebaseio.com",
      projectId: "tournment-leaderboard",
      storageBucket: "tournment-leaderboard.firebasestorage.app",
      messagingSenderId: "685244342962",
      appId: "1:685244342962:web:d31c15a67fb9b6161f5fab"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let focusedIdx = -1;
    let timerSecs = 0;
    let timerRunning = false;
    let timerInterval = null;

    // Realtime Listener
    db.ref("esports_data").on("value", snapshot => {
      const data = snapshot.val() || {};
      
      // Match & Map Config
      const config = data.config || {};
      const matchNum = config.match || 1;
      const mapName = (config.map || "BERMUDA").toUpperCase();
      document.getElementById("map-display").innerText = `MAP - ${matchNum} - ${mapName}`;
      focusedIdx = config.focused_index !== undefined ? config.focused_index : -1;

      // Match Timer
      const timer = data.timer || {};
      timerSecs = timer.seconds || 0;
      timerRunning = timer.running || false;
      renderTimer();

      // 12 Slot Team List
      const teams = data.teams || [];
      renderTeams(teams);
    });

    function renderTimer() {
      const m = Math.floor(timerSecs / 60).toString().padStart(2, '0');
      const s = (timerSecs % 60).toString().padStart(2, '0');
      document.getElementById("timer-display").innerText = `${m}:${s}`;

      if (timerRunning) {
        if (!timerInterval) {
          timerInterval = setInterval(() => {
            timerSecs++;
            const mm = Math.floor(timerSecs / 60).toString().padStart(2, '0');
            const ss = (timerSecs % 60).toString().padStart(2, '0');
            document.getElementById("timer-display").innerText = `${mm}:${ss}`;
          }, 1000);
        }
      } else {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      }
    }

    function renderTeams(teams) {
      const list = document.getElementById("teams-list");
      list.innerHTML = "";

      for (let i = 0; i < 12; i++) {
        const t = teams[i] || {};
        const booyahs = t.booyahs || 0;
        const name = t.name || t.teamName || `SLOT ${i + 1}`;
        const logo = t.logo || "https://via.placeholder.com/28/090e17/7e8fa4?text=S";

        list.innerHTML += `
          <div class="team-row ${focusedIdx === i ? 'focused' : ''}">
            <span class="team-idx">#${i + 1}</span>
            <img src="${logo}" class="team-logo" onerror="this.src='https://via.placeholder.com/28/090e17/7e8fa4?text=S'">
            <span class="team-name">${name}</span>
            ${booyahs > 0 ? `<span class="booyah-badge">🏆 x${booyahs}</span>` : ''}
          </div>
        `;
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Esports Manual Desk</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0c0e12;
    color: #e2e4e9;
    font-family: 'Rajdhani', sans-serif;
    padding: 16px;
  }

  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #232630; padding-bottom: 12px; margin-bottom: 16px;
  }
  .top-bar h2 { color: #8cf000; font-size: 20px; letter-spacing: 1px; }
  .btn-top {
    background: #8cf000; color: #000; font-weight: 800; border: none;
    padding: 8px 14px; border-radius: 4px; cursor: pointer; font-family: inherit;
  }
  .btn-danger { background: #d92d20; color: #fff; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }

  .team-card {
    background: #141720; border: 1px solid #252834; border-radius: 6px;
    padding: 10px; display: flex; flex-direction: column; gap: 8px;
  }
  .team-card.wiped { opacity: 0.55; border-color: #551111; }

  .row-top { display: flex; align-items: center; gap: 8px; }
  .slot-id { color: #8cf000; font-weight: 800; font-size: 14px; width: 22px; }
  .inp-name {
    background: #0a0c10; border: 1px solid #333644; color: #8cf000;
    font-weight: 800; padding: 5px 8px; border-radius: 4px; width: 90px;
    text-transform: uppercase; font-family: inherit; font-size: 14px;
  }
  .inp-logo {
    background: #0a0c10; border: 1px solid #333644; color: #8e929b;
    padding: 5px; border-radius: 4px; flex: 1; font-size: 11px;
  }

  /* Player Status Toggles */
  .player-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    background: #0a0c10;
    padding: 6px;
    border-radius: 4px;
  }
  .btn-player {
    border: none;
    padding: 6px 2px;
    font-size: 11px;
    font-weight: 800;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
    text-align: center;
  }
  .state-alive { background: #8cf000; color: #000; }
  .state-knock { background: #6c5ce7; color: #fff; }
  .state-dead  { background: #1c1d24; color: #666; border: 1px solid #333; }

  .actions {
    display: flex; gap: 6px; align-items: center; justify-content: space-between;
  }
  .btn-action {
    border: none; padding: 6px 10px; font-weight: 700; border-radius: 3px;
    cursor: pointer; font-family: inherit; font-size: 12px;
  }
  .btn-kill-add { background: #d92d20; color: #fff; }
  .btn-kill-sub { background: #2f1719; color: #f97066; }
  .btn-wipe { background: #373b47; color: #fff; }
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="top-bar">
    <h2>MANUAL DESK CONTROL</h2>
    <div style="display:flex; gap:8px;">
      <button class="btn-top" onclick="resetAllRevive()">REVIVE ALL (4 ALIVE)</button>
      <button class="btn-top btn-danger" onclick="resetAllKills()">RESET ALL KILLS</button>
    </div>
  </div>

  <div class="grid" id="teams-grid"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBRcMrsrifYv-VDsCrTMKZuQiub30a7wEs",
    authDomain: "tournment-leaderboard.firebaseapp.com",
    databaseURL: "https://tournment-leaderboard-default-rtdb.firebaseio.com",
    projectId: "tournment-leaderboard",
    storageBucket: "tournment-leaderboard.firebasestorage.app",
    messagingSenderId: "685244342962",
    appId: "1:685244342962:web:d31c15a67fb9b6161f5fab",
    measurementId: "G-RKSK1ZBC5M"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const defaultTeams = [
    { name: "ELC", logo: "", kills: 6, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}] },
    { name: "TNG", logo: "", kills: 5, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}] },
    { name: "INF", logo: "", kills: 4, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'dead'}] },
    { name: "X2",  logo: "", kills: 4, players: [{status:'dead'},  {status:'alive'}, {status:'alive'}, {status:'alive'}] },
    { name: "TOP", logo: "", kills: 3, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}] },
    { name: "RPR", logo: "", kills: 2, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}] },
    { name: "DVX", logo: "", kills: 1, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}] },
    { name: "RFX", logo: "", kills: 1, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}] },
    { name: "TEC", logo: "", kills: 1, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}] },
    { name: "NK",  logo: "", kills: 1, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'dead'}] },
    { name: "FES", logo: "", kills: 1, players: [{status:'alive'}, {status:'alive'}, {status:'dead'},  {status:'dead'}] },
    { name: "RA",  logo: "", kills: 3, players: [{status:'dead'},  {status:'dead'},  {status:'dead'},  {status:'dead'}] }
  ];

  let teams = defaultTeams;

  db.ref('esports_data/teams').on('value', (snap) => {
    const val = snap.val();
    if (val && Array.isArray(val)) {
      teams = val;
      renderGrid();
    } else {
      sync();
    }
  });

  function sync() {
    db.ref('esports_data/teams').set(teams);
    renderGrid();
  }

  // Cycles player status: alive -> knock -> dead -> alive
  function cyclePlayer(tIdx, pIdx) {
    const current = teams[tIdx].players[pIdx].status || 'alive';
    const next = current === 'alive' ? 'knock' : (current === 'knock' ? 'dead' : 'alive');
    teams[tIdx].players[pIdx].status = next;
    teams[tIdx].alive = teams[tIdx].players.filter(p => p.status === 'alive').length;
    sync();
  }

  function adjustKill(tIdx, amount) {
    teams[tIdx].kills = Math.max(0, (teams[tIdx].kills || 0) + amount);
    sync();
  }

  function wipeTeam(tIdx) {
    teams[tIdx].players.forEach(p => p.status = 'dead');
    teams[tIdx].alive = 0;
    sync();
  }

  function resetAllRevive() {
    teams.forEach(t => {
      t.players = [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}];
      t.alive = 4;
    });
    sync();
  }

  function resetAllKills() {
    teams.forEach(t => t.kills = 0);
    sync();
  }

  function renderGrid() {
    const grid = document.getElementById('teams-grid');
    grid.innerHTML = '';

    teams.forEach((t, i) => {
      if (!t.players) {
        t.players = [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}];
      }
      const isDead = t.players.every(p => p.status === 'dead');

      let playersHtml = t.players.map((p, pIdx) => `
        <button class="btn-player state-${p.status || 'alive'}" onclick="cyclePlayer(${i}, ${pIdx})">
          P${pIdx+1}: ${(p.status || 'alive').toUpperCase()}
        </button>
      `).join('');

      grid.innerHTML += `
        <div class="team-card ${isDead ? 'wiped' : ''}">
          <div class="row-top">
            <span class="slot-id">#${i + 1}</span>
            <input class="inp-name" value="${t.name || ''}" onchange="teams[${i}].name=this.value; sync();" />
            <input class="inp-logo" placeholder="Logo URL" value="${t.logo || ''}" onchange="teams[${i}].logo=this.value; sync();" />
          </div>

          <div class="player-row">
            ${playersHtml}
          </div>

          <div class="actions">
            <span>Elims: <b>${t.kills || 0}</b></span>
            <div style="display:flex; gap:4px;">
              <button class="btn-action btn-kill-add" onclick="adjustKill(${i}, 1)">+1 KILL</button>
              <button class="btn-action btn-kill-sub" onclick="adjustKill(${i}, -1)">-1</button>
              <button class="btn-action btn-wipe" onclick="wipeTeam(${i})">WIPE</button>
            </div>
          </div>
        </div>
      `;
    });
  }

  renderGrid();
</script>
</body>
</html>

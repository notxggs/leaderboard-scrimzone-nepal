<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScrimZone Nepal — Broadcast Master Controller</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --panel-bg: #121824;
      --card-bg: #182234;
      --border: #223049;
      --accent: #ff9800;
      --accent-hover: #e68900;
      --danger: #e53935;
      --success: #00c853;
      --text: #ffffff;
      --text-muted: #8899ac;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      padding: 16px 24px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Teko', sans-serif;
      font-size: 32px;
      letter-spacing: 1px;
      color: var(--accent);
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 13px;
      padding: 9px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-secondary { background: #223049; color: #fff; }
    .btn-secondary:hover { background: #2f4263; }
    .btn-success { background: var(--success); color: #000; }

    /* Slots Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .slot-card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .slot-card.active-team {
      border-color: var(--accent);
    }

    .slot-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .slot-num {
      font-family: 'Teko', sans-serif;
      font-size: 26px;
      background: #182234;
      padding: 2px 10px;
      border-radius: 6px;
      color: var(--accent);
    }

    .team-logo {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      object-fit: cover;
      background: #1c273c;
      border: 1px solid #2a3d5e;
    }

    .team-info h3 {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }

    .booyah-badge {
      font-size: 12px;
      color: #ffca28;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
    }

    .roster-box {
      background: var(--card-bg);
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .slot-actions {
      display: flex;
      gap: 6px;
      justify-content: space-between;
    }

    .booyah-control {
      display: flex;
      align-items: center;
      background: #182234;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .booyah-btn {
      background: transparent;
      color: var(--text);
      padding: 4px 10px;
      font-size: 14px;
    }

    .booyah-count {
      padding: 0 4px;
      font-weight: bold;
      font-size: 13px;
      color: var(--accent);
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-box {
      background: var(--panel-bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      max-width: 440px;
      width: 90%;
      text-align: center;
    }

    .modal-box h2 { font-size: 20px; margin-bottom: 8px; }
    .modal-box p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
    .modal-btns { display: flex; justify-content: center; gap: 12px; }

    /* History Audit Table */
    .history-section {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    th, td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }

    th { color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div>
      <h1>ScrimZone Broadcast Controller</h1>
      <span style="font-size: 12px; color: var(--text-muted);">Production Auto-Sync with Discord & Realtime Database</span>
    </div>
    <div class="header-actions">
      <button class="btn-secondary" onclick="openHistoryDrawer()">📜 Match History</button>
      <button class="btn-primary" onclick="confirmInitSlots()">⚡ Init 12 Slots</button>
      <button class="btn-danger" onclick="confirmResetAll()">⚠️ Reset Scrim</button>
    </div>
  </header>

  <!-- 12 Slot Grid -->
  <div class="grid" id="slots-grid"></div>

  <!-- History Audit Section -->
  <div class="history-section">
    <div class="history-header">
      <h3>📋 Registration Ledger & Booyah History</h3>
      <button class="btn-secondary" onclick="loadHistory()">🔄 Refresh History</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Slot</th>
          <th>Team Name</th>
          <th>Discord User ID</th>
          <th>Booyahs</th>
          <th>Logged Timestamp</th>
        </tr>
      </thead>
      <tbody id="history-table-body">
        <tr><td colspan="5" style="text-align:center;">Loading records...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Double Confirmation Modal -->
  <div class="modal-overlay" id="confirm-modal">
    <div class="modal-box">
      <h2 id="modal-title">⚠️ Are you absolutely sure?</h2>
      <p id="modal-desc">This action will modify data directly on the broadcast feed.</p>
      <div class="modal-btns">
        <button class="btn-secondary" onclick="closeConfirmModal()">Cancel</button>
        <button class="btn-danger" id="modal-confirm-btn">Confirm Action</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBRcMrsrifYv-VDsCrTMKZuQiub30a7wEs",
      authDomain: "tournment-leaderboard.firebaseapp.com",
      databaseURL: "https://tournment-leaderboard-default-rtdb.firebaseio.com",
      projectId: "tournment-leaderboard",
      storageBucket: "tournment-leaderboard.firebasestorage.app",
      messagingSenderId: "685244342962",
      appId: "1:685244342962:web:d31c15a67fb9b6161f5fab"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentTeams = [];

    // Realtime Listener
    db.ref("esports_data/teams").on("value", snapshot => {
      const data = snapshot.val();
      currentTeams = [];
      if (Array.isArray(data)) {
        currentTeams = data;
      } else if (data && typeof data === "object") {
        Object.keys(data).forEach(k => currentTeams[parseInt(k)] = data[k]);
      }
      renderSlots();
    });

    function renderSlots() {
      const grid = document.getElementById("slots-grid");
      grid.innerHTML = "";

      for (let i = 0; i < 12; i++) {
        const team = currentTeams[i] || { name: `SLOT ${i+1} (OPEN)`, booyahs: 0 };
        const isRegistered = team.discord_user_id || (team.name && !team.name.includes("OPEN"));
        const booyahs = team.booyahs || 0;
        const logo = team.logo || "https://via.placeholder.com/60/1c273c/8899ac?text=LOGO";

        const card = document.createElement("div");
        card.className = `slot-card ${isRegistered ? 'active-team' : ''}`;
        card.innerHTML = `
          <div>
            <div class="slot-header">
              <span class="slot-num">#${i+1}</span>
              <img src="${logo}" class="team-logo" alt="Logo" onerror="this.src='https://via.placeholder.com/60/1c273c/8899ac?text=LOGO'">
              <div class="team-info">
                <h3>${team.name || team.teamName || 'OPEN'}</h3>
                <div class="booyah-badge">${booyahs > 0 ? `🏆 ${booyahs} BOOYAH` : 'No Booyahs'}</div>
              </div>
            </div>
            <div class="roster-box">
              ${team.roster ? team.roster.join('<br>') : '1. -<br>2. -<br>3. -<br>4. -'}
            </div>
          </div>
          <div class="slot-actions">
            <div class="booyah-control">
              <button class="booyah-btn" onclick="updateBooyah(${i}, -1)">-</button>
              <span class="booyah-count">${booyahs}</span>
              <button class="booyah-btn" onclick="updateBooyah(${i}, 1)">+ 🏆</button>
            </div>
            ${isRegistered ? `<button class="btn-danger" style="padding: 4px 8px; font-size:11px;" onclick="confirmRemoveTeam(${i})">Remove</button>` : ''}
          </div>
        `;
        grid.appendChild(card);
      }
    }

    function updateBooyah(index, change) {
      if (!currentTeams[index]) return;
      let count = (currentTeams[index].booyahs || 0) + change;
      if (count < 0) count = 0;
      db.ref(`esports_data/teams/${index}/booyahs`).set(count);
    }

    function confirmInitSlots() {
      showConfirm("Initialize 12 Empty Slots?", "This will create 12 clean, empty slots for the upcoming scrim.", () => {
        const freshSlots = [];
        for (let i = 1; i <= 12; i++) {
          freshSlots.push({ name: `SLOT ${i} (OPEN)`, booyahs: 0 });
        }
        db.ref("esports_data/teams").set(freshSlots);
        closeConfirmModal();
      });
    }

    function confirmResetAll() {
      showConfirm("RESET ENTIRE SCRIM?", "This will clear all 12 teams and reset their trophies to 0.", () => {
        confirmInitSlots();
      });
    }

    function confirmRemoveTeam(index) {
      showConfirm(`Remove Team from Slot #${index+1}?`, "This slot will be reopened for registration.", () => {
        db.ref(`esports_data/teams/${index}`).set({
          name: `SLOT ${index+1} (OPEN)`,
          booyahs: 0
        });
        closeConfirmModal();
      });
    }

    // Modal Manager
    function showConfirm(title, desc, onConfirm) {
      document.getElementById("modal-title").innerText = title;
      document.getElementById("modal-desc").innerText = desc;
      const btn = document.getElementById("modal-confirm-btn");
      btn.onclick = onConfirm;
      document.getElementById("confirm-modal").style.display = "flex";
    }

    function closeConfirmModal() {
      document.getElementById("confirm-modal").style.display = "none";
    }

    // History Loader
    function loadHistory() {
      const tbody = document.getElementById("history-table-body");
      db.ref("esports_data/history").limitToLast(15).once("value", snap => {
        const data = snap.val();
        if (!data) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No match logs found.</td></tr>`;
          return;
        }
        tbody.innerHTML = "";
        Object.values(data).reverse().forEach(row => {
          const date = new Date(row.timestamp * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
          tbody.innerHTML += `
            <tr>
              <td>#${row.slot_index || '-'}</td>
              <td><strong>${row.team_name || 'Unknown'}</strong></td>
              <td><code>${row.discord_user_id || 'N/A'}</code></td>
              <td>🏆 ${row.booyahs || 0}</td>
              <td>${date}</td>
            </tr>
          `;
        });
      });
    }

    function openHistoryDrawer() {
      loadHistory();
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    loadHistory();
  </script>
</body>
</html>

<script>
  function checkPassword() {
    const val = document.getElementById('pass-input').value;
    if (val === "00") {
      document.getElementById('auth-overlay').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';
      setupDefaultDate();
    } else {
      document.getElementById('auth-err').style.display = 'block';
    }
  }

  document.getElementById('pass-input').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') checkPassword();
  });

  const firebaseConfig = {
    apiKey: "AIzaSyBRcMrsrifYv-VDsCrTMKZuQiub30a7wEs",
    authDomain: "tournment-leaderboard.firebaseapp.com",
    databaseURL: "https://tournment-leaderboard-default-rtdb.firebaseio.com",
    projectId: "tournment-leaderboard",
    storageBucket: "tournment-leaderboard.firebasestorage.app",
    messagingSenderId: "685244342962",
    appId: "1:685244342962:web:d31c15a67fb9b6161f5fab",
    measurementId: "G-RKSK1ZBC5M"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let teamsData = [];
  let activeSpectateIdx = 0;

  function setupDefaultDate() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('archive-date-picker').value = today;
    loadLiveTeams();
  }

  function switchDateArchive() {
    loadLiveTeams();
  }

  // Connects directly to the main teams path where your Discord bot writes
  function loadLiveTeams() {
    db.ref('esports_data/teams').on('value', (snap) => {
      const val = snap.val();
      if (val) {
        teamsData = Array.isArray(val) ? val : Object.values(val);
      } else {
        teamsData = [];
      }
      renderTeams();
      renderSpectateBar();
      renderHistoryTable();
    });
  }

  function updateMatchConfig() {
    const matchNum = document.getElementById('match-number-input').value || "1";
    const selectedMap = document.getElementById('map-select').value || "BERMUDA";
    db.ref('esports_data/match_info').set({ match: matchNum, map: selectedMap });
  }

  db.ref('esports_data/match_info').on('value', (snap) => {
    const data = snap.val();
    if (data) {
      if (data.match) document.getElementById('match-number-input').value = data.match;
      if (data.map) document.getElementById('map-select').value = data.map;
    }
  });

  db.ref('esports_data/active_spectate').on('value', (snap) => {
    const val = snap.val();
    if (val !== null && typeof val === 'number') {
      activeSpectateIdx = val;
      renderSpectateBar();
      markActiveCard();
    }
  });

  function renderSpectateBar() {
    const container = document.getElementById('spectate-btn-container');
    container.innerHTML = '';
    for (let idx = 0; idx < 12; idx++) {
      const team = (teamsData && teamsData[idx]) ? teamsData[idx] : {};
      const isRegistered = team.name && team.name.trim() !== '' && !team.name.toUpperCase().startsWith('SLOT ');
      const name = isRegistered ? team.name : `SLOT ${idx + 1}`;
      const isCurrent = activeSpectateIdx === idx;
      container.innerHTML += `
        <button class="spec-btn ${isCurrent ? 'current' : ''}" onclick="setActiveSpectate(${idx})">
          #${idx + 1} ${name}
        </button>
      `;
    }
  }

  function setActiveSpectate(idx) {
    db.ref('esports_data/active_spectate').set(idx);
  }

  function markActiveCard() {
    document.querySelectorAll('.team-card').forEach((card, idx) => {
      if (idx === activeSpectateIdx) card.classList.add('is-active-spec');
      else card.classList.remove('is-active-spec');
    });
  }

  function renderHistoryTable() {
    const tbody = document.getElementById('history-table-body');
    tbody.innerHTML = '';
    for (let idx = 0; idx < 12; idx++) {
      const team = (teamsData && teamsData[idx]) ? teamsData[idx] : {};
      const isRegistered = team.name && team.name.trim() !== '' && !team.name.toUpperCase().startsWith('SLOT ');
      const name = isRegistered ? team.name : `SLOT ${idx + 1} (Available)`;
      const roster = team.roster ? team.roster.filter(Boolean).join(', ') : '---';
      const booyahs = team.booyahs || 0;

      tbody.innerHTML += `
        <tr>
          <td><strong>#${idx + 1}</strong></td>
          <td style="${isRegistered ? 'color:#fff; font-weight:700;' : 'color:#64748b;'}">${name}</td>
          <td style="color:#94a3b8; font-family:'Chakra Petch';">${roster}</td>
          <td style="color:#d4af37; font-weight:800; font-family:'Chakra Petch';">👑 ${booyahs}</td>
        </tr>
      `;
    }
  }

  function renderTeams() {
    const container = document.getElementById('teams-container');
    container.innerHTML = '';
    for (let idx = 0; idx < 12; idx++) {
      const team = (teamsData && teamsData[idx]) ? teamsData[idx] : {};
      const isRegistered = team.name && team.name.trim() !== '' && !team.name.toUpperCase().startsWith('SLOT ');
      const name = isRegistered ? team.name : `SLOT ${idx + 1} (OPEN)`;
      const logo = (team.logo && team.logo.trim() !== '') ? team.logo : `https://dummyimage.com/44x44/000/d4af37&text=${isRegistered ? name[0] : (idx + 1)}`;
      const roster = team.roster || ["-", "-", "-", "-"];
      const booyahs = team.booyahs || 0;

      container.innerHTML += `
        <div class="team-card ${activeSpectateIdx === idx ? 'is-active-spec' : ''}" id="card-${idx}">
          <div class="card-top">
            <span class="slot-tag">#${idx + 1}</span>
            <img class="logo-preview" src="${logo}" onerror="this.src='https://dummyimage.com/44x44/000/d4af37&text=${idx + 1}';" />
            <div class="team-info-box">
              <div class="team-name-text">${name}</div>
              <div class="status-badge ${isRegistered ? '' : 'open'}">
                ${isRegistered ? `● REGISTERED (Booyahs: ${booyahs} 👑)` : '○ EMPTY SLOT'}
              </div>
            </div>
          </div>

          <div class="roster-box">
            <div class="dock-label" style="margin-bottom:2px;">ROSTER:</div>
            <div class="roster-grid">
              <div class="roster-item">1. ${roster[0] || '-'}</div>
              <div class="roster-item">2. ${roster[1] || '-'}</div>
              <div class="roster-item">3. ${roster[2] || '-'}</div>
              <div class="roster-item">4. ${roster[3] || '-'}</div>
            </div>
          </div>

          <div class="card-actions">
            <button class="btn-focus" onclick="setActiveSpectate(${idx})">FOCUS</button>
            ${isRegistered ? `<button class="btn-booyah" onclick="addBooyah(${idx})">BOOYAH 👑</button>` : ''}
            ${isRegistered ? `<button class="btn-clear" onclick="clearSlot(${idx})">CLEAR</button>` : ''}
          </div>
        </div>
      `;
    }
  }

  function addBooyah(idx) {
    const current = (teamsData[idx] && teamsData[idx].booyahs) ? teamsData[idx].booyahs : 0;
    const newCount = current + 1;
    db.ref(`esports_data/teams/${idx}/booyahs`).set(newCount).then(() => {
      alert(`Booyah awarded to Slot #${idx + 1} (${teamsData[idx].name})! Total: ${newCount}`);
    });
  }

  function initializeSlots() {
    const payload = [];
    for (let i = 0; i < 12; i++) {
      payload.push({
        name: `SLOT ${i + 1}`,
        logo: "",
        roster: ["-", "-", "-", "-"],
        kills: 0,
        alive: 4,
        booyahs: 0,
        players: [{ status: "alive" }, { status: "alive" }, { status: "alive" }, { status: "alive" }]
      });
    }
    db.ref('esports_data/teams').set(payload).then(() => {
      alert("Initialized 12 slots successfully!");
    });
  }

  function clearSlot(idx) {
    if (!confirm(`Clear Slot #${idx + 1}?`)) return;
    const emptySlot = {
      name: `SLOT ${idx + 1}`,
      logo: "",
      roster: ["-", "-", "-", "-"],
      kills: 0,
      alive: 4,
      booyahs: 0,
      players: [{ status: "alive" }, { status: "alive" }, { status: "alive" }, { status: "alive" }]
    };
    db.ref(`esports_data/teams/${idx}`).set(emptySlot);
  }

  function resetFullScrim() {
    if (!confirm("Reset all 12 slots?")) return;
    initializeSlots();
    db.ref('esports_data/timer').set({ running: false, seconds: 0, startTimestamp: null });
    db.ref('esports_data/active_spectate').set(0);
  }

  // Timer Handlers
  let timerState = { running: false, seconds: 0, startTimestamp: null };
  let localTimerInterval = null;

  db.ref('esports_data/timer').on('value', (snap) => {
    const val = snap.val();
    if (val) {
      timerState = val;
      const btn = document.getElementById('timer-toggle-btn');
      if (timerState.running) {
        btn.innerText = 'PAUSE';
        btn.classList.add('active');
      } else {
        btn.innerText = 'START';
        btn.classList.remove('active');
      }
      updateTimerDisplay();
    }
  });

  function formatTime(totalSec) {
    const m = String(Math.floor(totalSec / 60)).padStart(2, '0');
    const s = String(totalSec % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  function updateTimerDisplay() {
    clearInterval(localTimerInterval);
    if (timerState.running && timerState.startTimestamp) {
      localTimerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - timerState.startTimestamp) / 1000);
        document.getElementById('timer-display').innerText = formatTime(elapsed);
      }, 1000);
      const elapsed = Math.floor((Date.now() - timerState.startTimestamp) / 1000);
      document.getElementById('timer-display').innerText = formatTime(elapsed);
    } else {
      document.getElementById('timer-display').innerText = formatTime(timerState.seconds || 0);
    }
  }

  function toggleTimer() {
    if (timerState.running) {
      const elapsed = Math.floor((Date.now() - timerState.startTimestamp) / 1000);
      db.ref('esports_data/timer').set({ running: false, seconds: elapsed, startTimestamp: null });
    } else {
      const currentSeconds = timerState.seconds || 0;
      db.ref('esports_data/timer').set({ running: true, seconds: currentSeconds, startTimestamp: Date.now() - (currentSeconds * 1000) });
    }
  }

  function resetTimer() {
    db.ref('esports_data/timer').set({ running: false, seconds: 0, startTimestamp: null });
  }
</script>

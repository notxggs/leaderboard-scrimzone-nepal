<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Esports Broadcast Admin Panel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Rajdhani:wght@600;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0e14;
    color: #e2e8f0;
    font-family: 'Rajdhani', sans-serif;
    padding: 16px;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: #121824;
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 12px 20px;
    margin-bottom: 16px;
  }
  h1 {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 22px;
    color: #426aef;
    letter-spacing: 1px;
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  /* Match & Map Selectors */
  .match-info-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #0b0e14;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid #1e293b;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: #94a3b8;
  }
  .match-info-controls select, .match-info-controls input {
    background: #1e293b;
    color: #fff;
    border: 1px solid #334155;
    border-radius: 4px;
    padding: 4px 8px;
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    outline: none;
  }
  .match-info-controls input { width: 60px; }

  /* Timer Controls */
  .timer-section {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .timer-clock {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: #38bdf8;
    min-width: 75px;
    text-align: center;
  }
  button {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    cursor: pointer;
    border-radius: 4px;
    border: none;
    transition: 0.15s ease;
  }
  .btn-timer {
    padding: 6px 12px;
    font-size: 12px;
    background: #1e293b;
    color: #fff;
  }
  .btn-timer:hover { background: #334155; }
  .btn-timer.active { background: #16a34a; }

  /* 1-Click Spectate Bar */
  .spectate-bar-wrap {
    background: #121824;
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 16px;
  }
  .section-title {
    font-size: 12px;
    font-weight: 800;
    color: #94a3b8;
    letter-spacing: 1.5px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .spectate-btn-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .spec-btn {
    background: #1e293b;
    color: #cbd5e1;
    border: 1px solid #334155;
    padding: 8px 14px;
    font-size: 13px;
    border-radius: 4px;
  }
  .spec-btn.current {
    background: #426aef;
    color: #fff;
    border-color: #60a5fa;
    box-shadow: 0 0 10px rgba(66, 106, 239, 0.5);
  }

  /* Grid of 12 Teams */
  .teams-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 14px;
  }
  .team-card {
    background: #121824;
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .team-card.is-active-spec {
    border-color: #426aef;
  }

  .card-top {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .slot-tag {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    color: #426aef;
    font-size: 16px;
    min-width: 32px;
  }
  .logo-preview {
    width: 38px;
    height: 38px;
    border-radius: 4px;
    object-fit: contain;
    background: #000;
    border: 1px solid #334155;
    flex-shrink: 0;
  }
  .input-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 100%;
  }
  input[type="text"] {
    background: #0b0e14;
    border: 1px solid #334155;
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 4px;
    width: 100%;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #426aef;
  }

  .roster-section {
    background: #0b0e14;
    padding: 8px 10px;
    border-radius: 4px;
    border: 1px solid #1e293b;
  }
  .roster-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    margin-top: 4px;
  }
  .roster-input {
    font-size: 12px !important;
    padding: 5px 8px !important;
    text-transform: uppercase;
  }

  .stats-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0b0e14;
    padding: 6px 10px;
    border-radius: 4px;
    border: 1px solid #1e293b;
  }
  .kill-box {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn-circle {
    width: 26px;
    height: 26px;
    background: #1e293b;
    color: #fff;
    font-size: 16px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-circle:hover { background: #426aef; }
  .kill-num {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 20px;
    font-weight: 700;
    min-width: 24px;
    text-align: center;
  }

  .players-alive-box {
    display: flex;
    gap: 5px;
  }
  .player-toggle-btn {
    padding: 4px 8px;
    font-size: 11px;
    background: #1e293b;
    color: #64748b;
    border: 1px solid #334155;
    border-radius: 3px;
  }
  .player-toggle-btn.alive {
    background: #426aef;
    color: #fff;
    border-color: #60a5fa;
  }

  .btn-save-team {
    background: #426aef;
    color: #fff;
    padding: 8px;
    font-size: 13px;
    width: 100%;
    margin-top: 4px;
  }
  .btn-save-team:hover { background: #3154c8; }
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <header>
    <h1>ESPORTS BROADCAST ADMIN CONTROLLER</h1>

    <div class="header-controls">
      <!-- Match Number & Map Selector -->
      <div class="match-info-controls">
        <label>MATCH #:</label>
        <input type="number" id="match-number-input" value="1" min="1" max="15" onchange="updateMatchConfig()">

        <label>MAP:</label>
        <select id="map-select" onchange="updateMatchConfig()">
          <option value="BERMUDA">BERMUDA</option>
          <option value="PURGATORY">PURGATORY</option>
          <option value="KALAHARI">KALAHARI</option>
          <option value="NEXTERRA">NEXTERRA</option>
        </select>
      </div>

      <!-- Match Timer -->
      <div class="timer-section">
        <div class="timer-clock" id="timer-display">00:00</div>
        <button class="btn-timer" id="timer-toggle-btn" onclick="toggleTimer()">START</button>
        <button class="btn-timer" onclick="resetTimer()">RESET</button>
      </div>
    </div>
  </header>

  <!-- Rapid Spectator Bar -->
  <div class="spectate-bar-wrap">
    <div class="section-title">CURRENT SPECTATING FOCUS (TAP TO CHANGE):</div>
    <div class="spectate-btn-grid" id="spectate-btn-container"></div>
  </div>

  <!-- 12-Team Card Grid -->
  <div class="teams-grid" id="teams-container"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBRcMrsrifYv-VDsCrTMKZuQiub30a7wEs",
    authDomain: "tournment-leaderboard.firebaseapp.com",
    databaseURL: "https://tournment-leaderboard-default-rtdb.firebaseio.com",
    projectId: "tournment-leaderboard",
    storageBucket: "tournment-leaderboard.firebasestorage.app",
    messagingSenderId: "685244342962",
    appId: "1:685244342962:web:d31c15a67fb9b6161f5fab",
    measurementId: "G-RKSK1ZBC5M"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let teamsData = [];
  let activeSpectateIdx = null;

  // Match Config Sync
  function updateMatchConfig() {
    const matchNum = document.getElementById('match-number-input').value || "1";
    const selectedMap = document.getElementById('map-select').value || "BERMUDA";

    db.ref('esports_data/match_info').set({
      match: matchNum,
      map: selectedMap
    });
  }

  db.ref('esports_data/match_info').on('value', (snap) => {
    const data = snap.val();
    if (data) {
      if (data.match) document.getElementById('match-number-input').value = data.match;
      if (data.map) document.getElementById('map-select').value = data.map;
    }
  });

  // Teams Sync
  db.ref('esports_data/teams').on('value', (snap) => {
    const val = snap.val();
    if (val && Array.isArray(val)) {
      teamsData = val;
      renderTeams();
      renderSpectateBar();
    }
  });

  // Active Spectate Sync
  db.ref('esports_data/active_spectate').on('value', (snap) => {
    activeSpectateIdx = snap.val();
    renderSpectateBar();
    markActiveCard();
  });

  function renderSpectateBar() {
    const container = document.getElementById('spectate-btn-container');
    container.innerHTML = '';
    teamsData.forEach((team, idx) => {
      const name = (team.name && team.name.trim() !== '') ? team.name : `SLOT ${idx + 1}`;
      const isCurrent = activeSpectateIdx === idx;
      container.innerHTML += `
        <button class="spec-btn ${isCurrent ? 'current' : ''}" onclick="setActiveSpectate(${idx})">
          #${idx + 1} ${name}
        </button>
      `;
    });
  }

  function setActiveSpectate(idx) {
    db.ref('esports_data/active_spectate').set(idx);
  }

  function markActiveCard() {
    document.querySelectorAll('.team-card').forEach((card, idx) => {
      if (idx === activeSpectateIdx) {
        card.classList.add('is-active-spec');
      } else {
        card.classList.remove('is-active-spec');
      }
    });
  }

  function renderTeams() {
    const container = document.getElementById('teams-container');
    container.innerHTML = '';

    teamsData.forEach((team, idx) => {
      const name = team.name || '';
      const logo = team.logo || '';
      const kills = team.kills || 0;
      const players = team.players || [
        { status: 'alive' }, { status: 'alive' },
        { status: 'alive' }, { status: 'alive' }
      ];
      const roster = team.roster || ['', '', '', ''];
      const fallbackLogo = `https://dummyimage.com/38x38/000/426aef&text=${name ? name[0] : (idx + 1)}`;

      let playerToggles = '';
      players.slice(0, 4).forEach((p, pIdx) => {
        const isAlive = p.status === 'alive';
        playerToggles += `
          <button class="player-toggle-btn ${isAlive ? 'alive' : ''}" onclick="togglePlayerStatus(${idx}, ${pIdx})">
            P${pIdx + 1}
          </button>
        `;
      });

      container.innerHTML += `
        <div class="team-card ${activeSpectateIdx === idx ? 'is-active-spec' : ''}" id="card-${idx}">
          <div class="card-top">
            <span class="slot-tag">#${idx + 1}</span>
            <img class="logo-preview" src="${logo || fallbackLogo}" onerror="this.src='${fallbackLogo}'" />
            <div class="input-group">
              <input type="text" id="name-${idx}" placeholder="Team Name" value="${name}">
              <input type="text" id="logo-${idx}" placeholder="Logo URL (https://...)" value="${logo}">
            </div>
          </div>

          <div class="roster-section">
            <div class="section-title">TEAM MEMBERS (FOR AUTO-DETECTION):</div>
            <div class="roster-grid">
              <input class="roster-input" type="text" id="r-${idx}-0" placeholder="P1 IGN" value="${roster[0] || ''}">
              <input class="roster-input" type="text" id="r-${idx}-1" placeholder="P2 IGN" value="${roster[1] || ''}">
              <input class="roster-input" type="text" id="r-${idx}-2" placeholder="P3 IGN" value="${roster[2] || ''}">
              <input class="roster-input" type="text" id="r-${idx}-3" placeholder="P4 IGN" value="${roster[3] || ''}">
            </div>
          </div>

          <div class="stats-row">
            <div class="kill-box">
              <span style="font-size:12px; font-weight:800; color:#94a3b8;">KILLS:</span>
              <button class="btn-circle" onclick="changeKills(${idx}, -1)">-</button>
              <span class="kill-num">${kills}</span>
              <button class="btn-circle" onclick="changeKills(${idx}, 1)">+</button>
            </div>
            <div class="players-alive-box">
              ${playerToggles}
            </div>
          </div>

          <button class="btn-save-team" onclick="saveTeamInfo(${idx}, this)">SAVE TEAM #${idx + 1}</button>
        </div>
      `;
    });
  }

  function saveTeamInfo(idx, btn) {
    const nameVal = document.getElementById(`name-${idx}`).value.trim();
    const logoVal = document.getElementById(`logo-${idx}`).value.trim();

    const r0 = document.getElementById(`r-${idx}-0`).value.trim();
    const r1 = document.getElementById(`r-${idx}-1`).value.trim();
    const r2 = document.getElementById(`r-${idx}-2`).value.trim();
    const r3 = document.getElementById(`r-${idx}-3`).value.trim();

    const rosterArr = [r0, r1, r2, r3].filter(Boolean);

    db.ref(`esports_data/teams/${idx}`).update({
      name: nameVal,
      logo: logoVal,
      roster: rosterArr
    }).then(() => {
      const originalText = btn.innerText;
      btn.innerText = 'SAVED!';
      btn.style.background = '#16a34a';
      setTimeout(() => {
        btn.innerText = originalText;
        btn.style.background = '#426aef';
      }, 1000);
    });
  }

  function changeKills(teamIdx, amount) {
    const current = Number(teamsData[teamIdx].kills) || 0;
    const updated = Math.max(0, current + amount);
    db.ref(`esports_data/teams/${teamIdx}/kills`).set(updated);
  }

  function togglePlayerStatus(teamIdx, playerIdx) {
    const players = teamsData[teamIdx].players || [
      { status: 'alive' }, { status: 'alive' },
      { status: 'alive' }, { status: 'alive' }
    ];

    players[playerIdx].status = players[playerIdx].status === 'alive' ? 'dead' : 'alive';
    const aliveCount = players.filter(p => p.status === 'alive').length;

    db.ref(`esports_data/teams/${teamIdx}`).update({
      players: players,
      alive: aliveCount
    });
  }

  // Match Timer Management
  let timerState = { running: false, seconds: 0, startTimestamp: null };
  let localTimerInterval = null;

  db.ref('esports_data/timer').on('value', (snap) => {
    const val = snap.val();
    if (val) {
      timerState = val;
      const btn = document.getElementById('timer-toggle-btn');
      if (timerState.running) {
        btn.innerText = 'PAUSE';
        btn.classList.add('active');
      } else {
        btn.innerText = 'START';
        btn.classList.remove('active');
      }
      updateTimerDisplay();
    }
  });

  function formatTime(totalSec) {
    const m = String(Math.floor(totalSec / 60)).padStart(2, '0');
    const s = String(totalSec % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  function updateTimerDisplay() {
    clearInterval(localTimerInterval);
    if (timerState.running && timerState.startTimestamp) {
      localTimerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - timerState.startTimestamp) / 1000);
        document.getElementById('timer-display').innerText = formatTime(elapsed);
      }, 1000);
      const elapsed = Math.floor((Date.now() - timerState.startTimestamp) / 1000);
      document.getElementById('timer-display').innerText = formatTime(elapsed);
    } else {
      document.getElementById('timer-display').innerText = formatTime(timerState.seconds || 0);
    }
  }

  function toggleTimer() {
    if (timerState.running) {
      const elapsed = Math.floor((Date.now() - timerState.startTimestamp) / 1000);
      db.ref('esports_data/timer').set({
        running: false,
        seconds: elapsed,
        startTimestamp: null
      });
    } else {
      const currentSeconds = timerState.seconds || 0;
      db.ref('esports_data/timer').set({
        running: true,
        seconds: currentSeconds,
        startTimestamp: Date.now() - (currentSeconds * 1000)
      });
    }
  }

  function resetTimer() {
    db.ref('esports_data/timer').set({
      running: false,
      seconds: 0,
      startTimestamp: null
    });
  }
</script>
</body>
</html>

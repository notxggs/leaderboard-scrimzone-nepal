<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Esports Master Console</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&family=Chakra+Petch:wght@700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #08090d;
    color: #e5e7eb;
    font-family: 'Rajdhani', sans-serif;
    padding: 12px;
    user-select: none;
  }

  /* Sticky Top Master HUD */
  .master-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #10121a;
    border: 1px solid #1f2333;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.6);
  }

  .title-wrap h2 {
    color: #8cf000;
    font-size: 20px;
    letter-spacing: 1px;
    line-height: 1;
  }
  .title-wrap span {
    font-size: 11px;
    color: #6b7280;
    font-family: 'Chakra Petch', sans-serif;
  }

  /* High Visibility Timer Bar */
  .timer-deck {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #08090d;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid #252b3b;
  }
  .timer-clock {
    font-size: 22px;
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    color: #8cf000;
    min-width: 65px;
    text-align: center;
  }
  .btn-t {
    border: none;
    padding: 6px 10px;
    font-weight: 800;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
  }
  .btn-t-start { background: #8cf000; color: #000; }
  .btn-t-pause { background: #f59e0b; color: #000; }
  .btn-t-reset { background: #374151; color: #fff; }

  /* Emergency Control Buttons */
  .top-btn-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .btn-undo {
    background: #4b5563;
    color: #fff;
    border: none;
    padding: 7px 12px;
    border-radius: 4px;
    font-weight: 800;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-undo:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-revive-all {
    background: #1b2618;
    color: #8cf000;
    border: 1px solid #2d4524;
    padding: 7px 12px;
    border-radius: 4px;
    font-weight: 800;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-reset-kills {
    background: #2b1416;
    color: #ef4444;
    border: 1px solid #4a1d22;
    padding: 7px 12px;
    border-radius: 4px;
    font-weight: 800;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }

  /* Rapid Killfeed Action Assistant */
  .quick-killfeed-bar {
    background: #141724;
    border: 1px solid #2a3147;
    border-radius: 8px;
    padding: 8px 14px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .quick-killfeed-bar label {
    font-size: 12px;
    font-weight: 800;
    color: #8cf000;
    letter-spacing: 0.5px;
  }
  .killfeed-select {
    background: #08090d;
    border: 1px solid #374151;
    color: #fff;
    font-family: inherit;
    font-weight: 700;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 4px;
    min-width: 110px;
  }
  .btn-auto-clash {
    background: #ef4444;
    color: #fff;
    border: none;
    padding: 7px 16px;
    border-radius: 4px;
    font-family: inherit;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    transition: 0.1s transform;
  }
  .btn-auto-clash:active { transform: scale(0.97); }

  /* Slots Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 10px;
  }

  .team-card {
    background: #11131c;
    border: 1px solid #1f2333;
    border-radius: 8px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
    transition: border-color 0.15s;
  }
  .team-card.selected-focus {
    border-color: #8cf000;
    box-shadow: 0 0 10px rgba(140, 240, 0, 0.25);
  }
  .team-card.wiped {
    opacity: 0.4;
    background: #0b0c12;
    border-color: #3b1619;
  }

  /* Slot Header */
  .card-header {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .slot-chip {
    background: rgba(140, 240, 0, 0.12);
    color: #8cf000;
    font-size: 12px;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .inp-team-name {
    background: #08090d;
    border: 1px solid #2a3147;
    color: #8cf000;
    font-size: 14px;
    font-weight: 800;
    padding: 4px 6px;
    border-radius: 4px;
    width: 90px;
    text-transform: uppercase;
    font-family: inherit;
  }
  .inp-logo-url {
    background: #08090d;
    border: 1px solid #2a3147;
    color: #9ca3af;
    font-size: 11px;
    padding: 4px 6px;
    border-radius: 4px;
    flex: 1;
    font-family: inherit;
  }

  /* Alive Indicator Bars */
  .squad-status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #08090d;
    border: 1px solid #1c202e;
    border-radius: 6px;
    padding: 6px 10px;
  }
  .bars-display {
    display: flex;
    gap: 5px;
  }
  .stat-bar {
    width: 22px;
    height: 18px;
    border-radius: 3px;
    cursor: pointer;
    transition: 0.15s;
  }
  .stat-bar.on { background: #8cf000; box-shadow: 0 0 6px rgba(140, 240, 0, 0.3); }
  .stat-bar.off { background: #1c202e; border: 1px solid #2d3348; }

  /* Elimination Steppers */
  .score-controls {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 5px;
  }
  .btn-sub-score {
    border: none;
    padding: 8px 4px;
    font-family: inherit;
    font-weight: 800;
    font-size: 13px;
    border-radius: 4px;
    cursor: pointer;
  }
  .btn-add-kill { background: #ef4444; color: #fff; }
  .btn-kill-minus { background: #241416; color: #f87171; border: 1px solid #4a1d22; }
  .btn-wipe-squad { background: #262938; color: #e5e7eb; }
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- 1. Master Sticky Navigation -->
  <div class="master-bar">
    <div class="title-wrap">
      <h2>MASTER ESPORTS DECK</h2>
      <span>FIREBASE REALTIME LINK ACTIVE</span>
    </div>

    <!-- Timer Control Engine -->
    <div class="timer-deck">
      <span class="timer-clock" id="clock-readout">00:00</span>
      <button class="btn-t btn-t-start" onclick="startTimer()">START</button>
      <button class="btn-t btn-t-pause" onclick="pauseTimer()">PAUSE</button>
      <button class="btn-t btn-t-reset" onclick="resetTimer()">RESET</button>
    </div>

    <!-- Rapid Actions -->
    <div class="top-btn-group">
      <button class="btn-undo" id="btn-undo" onclick="performUndo()" disabled>UNDO</button>
      <button class="btn-revive-all" onclick="reviveAllSquads()">REVIVE ALL (4/4)</button>
      <button class="btn-reset-kills" onclick="resetAllMatchKills()">RESET ALL KILLS</button>
    </div>
  </div>

  <!-- 2. Fast Killfeed Clash Assistant -->
  <div class="quick-killfeed-bar">
    <label>FAST KILLFEED ACTION:</label>
    <select id="killer-select" class="killfeed-select"></select>
    <span style="color:#ef4444; font-weight:800;">ELIMINATED</span>
    <select id="victim-select" class="killfeed-select"></select>
    <button class="btn-auto-clash" onclick="executeFastKillfeedClash()">+1 KILL & -1 PLAYER</button>
  </div>

  <!-- 3. Slots Grid -->
  <div class="grid" id="slots-canvas"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBRcMrsrifYv-VDsCrTMKZuQiub30a7wEs",
    authDomain: "tournment-leaderboard.firebaseapp.com",
    databaseURL: "https://tournment-leaderboard-default-rtdb.firebaseio.com",
    projectId: "tournment-leaderboard",
    storageBucket: "tournment-leaderboard.firebasestorage.app",
    messagingSenderId: "685244342962",
    appId: "1:685244342962:web:d31c15a67fb9b6161f5fab",
    measurementId: "G-RKSK1ZBC5M"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let teams = [
    { name: "ELC", logo: "", kills: 6, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}] },
    { name: "TNG", logo: "", kills: 5, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}] },
    { name: "INF", logo: "", kills: 4, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'dead'}] },
    { name: "X2",  logo: "", kills: 4, players: [{status:'dead'},  {status:'alive'}, {status:'alive'}, {status:'alive'}] },
    { name: "TOP", logo: "", kills: 3, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}] },
    { name: "RPR", logo: "", kills: 2, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}] },
    { name: "DVX", logo: "", kills: 1, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}] },
    { name: "RFX", logo: "", kills: 1, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}] },
    { name: "TEC", logo: "", kills: 1, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}] },
    { name: "NK",  logo: "", kills: 1, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'dead'}] },
    { name: "FES", logo: "", kills: 1, players: [{status:'alive'}, {status:'alive'}, {status:'dead'},  {status:'dead'}] },
    { name: "RA",  logo: "", kills: 3, players: [{status:'dead'},  {status:'dead'},  {status:'dead'},  {status:'dead'}] }
  ];

  let undoState = null;
  let focusedSlot = 0;

  // Firebase Realtime Listener
  db.ref('esports_data/teams').on('value', (snap) => {
    const val = snap.val();
    if (val && Array.isArray(val)) {
      teams = val;
      renderSlots();
      updateFastSelectors();
    } else {
      pushSync();
    }
  });

  function pushSync(trackUndo = true) {
    if (trackUndo) {
      undoState = JSON.parse(JSON.stringify(teams));
      document.getElementById('btn-undo').disabled = false;
    }
    db.ref('esports_data/teams').set(teams);
    renderSlots();
    updateFastSelectors();
  }

  function performUndo() {
    if (undoState) {
      teams = JSON.parse(JSON.stringify(undoState));
      undoState = null;
      document.getElementById('btn-undo').disabled = true;
      db.ref('esports_data/teams').set(teams);
      renderSlots();
    }
  }

  // Fast Killfeed Clash Execution
  function executeFastKillfeedClash() {
    const killerIdx = parseInt(document.getElementById('killer-select').value);
    const victimIdx = parseInt(document.getElementById('victim-select').value);

    if (isNaN(killerIdx) || isNaN(victimIdx) || killerIdx === victimIdx) return;

    // Add +1 Kill to Killer
    teams[killerIdx].kills = (teams[killerIdx].kills || 0) + 1;

    // Subtract 1 Alive player from victim
    const firstAlive = teams[victimIdx].players.find(p => p.status !== 'dead');
    if (firstAlive) {
      firstAlive.status = 'dead';
      teams[victimIdx].alive = teams[victimIdx].players.filter(p => p.status === 'alive').length;
    }

    pushSync();
  }

  function updateFastSelectors() {
    const killerSel = document.getElementById('killer-select');
    const victimSel = document.getElementById('victim-select');
    const prevKiller = killerSel.value;
    const prevVictim = victimSel.value;

    killerSel.innerHTML = '';
    victimSel.innerHTML = '';

    teams.forEach((t, i) => {
      killerSel.innerHTML += `<option value="${i}">${i+1}. ${t.name || 'SLOT'}</option>`;
      victimSel.innerHTML += `<option value="${i}">${i+1}. ${t.name || 'SLOT'}</option>`;
    });

    if (prevKiller) killerSel.value = prevKiller;
    if (prevVictim) victimSel.value = prevVictim;
  }

  // Quick Action Modifiers
  function adjustKills(idx, amount) {
    teams[idx].kills = Math.max(0, (teams[idx].kills || 0) + amount);
    pushSync();
  }

  function toggleSinglePlayer(teamIdx, playerIdx) {
    const current = teams[teamIdx].players[playerIdx].status;
    teams[teamIdx].players[playerIdx].status = current === 'dead' ? 'alive' : 'dead';
    teams[teamIdx].alive = teams[teamIdx].players.filter(p => p.status === 'alive').length;
    pushSync();
  }

  function wipeTeam(idx) {
    teams[idx].players.forEach(p => p.status = 'dead');
    teams[idx].alive = 0;
    pushSync();
  }

  function reviveAllSquads() {
    teams.forEach(t => {
      t.players = [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}];
      t.alive = 4;
    });
    pushSync();
  }

  function resetAllMatchKills() {
    if (confirm("Reset ALL team kills to 0?")) {
      teams.forEach(t => t.kills = 0);
      pushSync();
    }
  }

  // Render Slots
  function renderSlots() {
    const canvas = document.getElementById('slots-canvas');
    canvas.innerHTML = '';

    teams.forEach((t, i) => {
      if (!t.players) {
        t.players = [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}];
      }
      const isDead = t.players.every(p => p.status === 'dead');
      const aliveCount = t.players.filter(p => p.status === 'alive').length;

      let barsHtml = t.players.map((p, pIdx) => `
        <div 
          class="stat-bar ${p.status === 'dead' ? 'off' : 'on'}" 
          onclick="toggleSinglePlayer(${i}, ${pIdx})"
          title="Click to toggle P${pIdx+1}">
        </div>
      `).join('');

      canvas.innerHTML += `
        <div class="team-card ${isDead ? 'wiped' : ''} ${focusedSlot === i ? 'selected-focus' : ''}" onclick="focusedSlot=${i}">
          <div class="card-header">
            <span class="slot-chip">#${i + 1}</span>
            <input class="inp-team-name" value="${t.name || ''}" onchange="teams[${i}].name=this.value.trim().toUpperCase(); pushSync();" />
            <input class="inp-logo-url" placeholder="Logo URL" value="${t.logo || ''}" onchange="teams[${i}].logo=this.value.trim(); pushSync();" />
          </div>

          <div class="squad-status-row">
            <span style="font-weight:700; font-size:13px; color:#9ca3af;">ALIVE: <b style="color:#fff;">${aliveCount}/4</b></span>
            <div class="bars-display">${barsHtml}</div>
          </div>

          <div class="score-controls">
            <button class="btn-sub-score btn-add-kill" onclick="adjustKills(${i}, 1)">+1 KILL (${t.kills || 0})</button>
            <button class="btn-sub-score btn-kill-minus" onclick="adjustKills(${i}, -1)">-1 KILL</button>
            <button class="btn-sub-score btn-wipe-squad" onclick="wipeTeam(${i})">WIPE</button>
          </div>
        </div>
      `;
    });
  }

  // Global Keyboard Shortcuts
  window.addEventListener('keydown', (e) => {
    // Prevent typing inside inputs from triggering hotkeys
    if (['INPUT', 'SELECT'].includes(document.activeElement.tagName)) return;

    if (e.key >= '1' && e.key <= '9') {
      focusedSlot = parseInt(e.key) - 1;
      renderSlots();
    } else if (e.key === '0') {
      focusedSlot = 9; // Slot 10
      renderSlots();
    } else if (e.key === '+' || e.key === '=') {
      adjustKills(focusedSlot, 1);
    } else if (e.key === '-' || e.key === '_') {
      adjustKills(focusedSlot, -1);
    } else if (e.key.toLowerCase() === 'w') {
      wipeTeam(focusedSlot);
    }
  });

  // Timer Code
  let timerState = { running: false, seconds: 0, startTimestamp: null };
  let localTimerInterval = null;

  db.ref('esports_data/timer').on('value', (snap) => {
    const val = snap.val();
    if (val) {
      timerState = val;
      updateTimerUI();
    }
  });

  function formatTime(s) {
    return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  }

  function updateTimerUI() {
    clearInterval(localTimerInterval);
    if (timerState.running && timerState.startTimestamp) {
      localTimerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - timerState.startTimestamp) / 1000);
        document.getElementById('clock-readout').innerText = formatTime(elapsed);
      }, 1000);
      const elapsed = Math.floor((Date.now() - timerState.startTimestamp) / 1000);
      document.getElementById('clock-readout').innerText = formatTime(elapsed);
    } else {
      document.getElementById('clock-readout').innerText = formatTime(timerState.seconds || 0);
    }
  }

  function startTimer() {
    const sec = timerState.seconds || 0;
    db.ref('esports_data/timer').set({
      running: true,
      seconds: sec,
      startTimestamp: Date.now() - (sec * 1000)
    });
  }

  function pauseTimer() {
    if (!timerState.running) return;
    const elapsed = Math.floor((Date.now() - timerState.startTimestamp) / 1000);
    db.ref('esports_data/timer').set({
      running: false,
      seconds: elapsed,
      startTimestamp: null
    });
  }

  function resetTimer() {
    db.ref('esports_data/timer').set({
      running: false,
      seconds: 0,
      startTimestamp: null
    });
  }

  renderSlots();
</script>
</body>
</html>

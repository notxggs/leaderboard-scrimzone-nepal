<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Esports Admin Desk</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&family=Chakra+Petch:wght@600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #090a0f;
    color: #e5e7eb;
    font-family: 'Rajdhani', sans-serif;
    padding: 14px;
    user-select: none;
  }

  /* Top Navigation Bar */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #12141c;
    border: 1px solid #1f2330;
    border-radius: 8px;
    padding: 10px 16px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .title-group h2 {
    color: #8cf000;
    font-size: 22px;
    letter-spacing: 1px;
    line-height: 1;
  }
  .title-group span {
    font-size: 11px;
    color: #6b7280;
    font-family: 'Chakra Petch', sans-serif;
  }

  /* Timer Controls */
  .timer-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #090a0f;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid #282e3f;
  }
  .timer-clock {
    font-size: 20px;
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    color: #8cf000;
    min-width: 60px;
    text-align: center;
  }
  .btn-timer {
    border: none;
    padding: 6px 12px;
    font-weight: 800;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    transition: opacity 0.15s;
  }
  .btn-timer:hover { opacity: 0.85; }
  .btn-start { background: #8cf000; color: #000; }
  .btn-pause { background: #f59e0b; color: #000; }
  .btn-reset { background: #374151; color: #fff; }

  /* Top Controls & Search */
  .actions-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .search-input {
    background: #090a0f;
    border: 1px solid #282e3f;
    color: #fff;
    padding: 7px 12px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
    width: 140px;
  }
  .search-input:focus { border-color: #8cf000; }

  .btn-top {
    border: none;
    padding: 7px 13px;
    border-radius: 4px;
    font-weight: 800;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: 0.15s;
  }
  .btn-revive { background: #1f2937; color: #8cf000; border: 1px solid #374151; }
  .btn-revive:hover { background: #374151; }
  .btn-danger { background: #ef4444; color: #fff; }

  /* Teams Grid Layout */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
    gap: 12px;
  }

  .team-card {
    background: #12141c;
    border: 1px solid #1f2330;
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: transform 0.15s, border-color 0.15s;
    position: relative;
  }
  .team-card:hover { border-color: #374151; }
  .team-card.wiped {
    opacity: 0.45;
    background: #0f1017;
    border-color: #331518;
  }

  /* Card Header */
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .slot-tag {
    font-size: 13px;
    font-weight: 800;
    color: #8cf000;
    background: rgba(140, 240, 0, 0.08);
    padding: 3px 6px;
    border-radius: 4px;
  }
  .name-input {
    background: #090a0f;
    border: 1px solid #282e3f;
    color: #8cf000;
    font-weight: 800;
    font-size: 15px;
    padding: 4px 8px;
    border-radius: 4px;
    width: 100px;
    text-transform: uppercase;
    font-family: inherit;
  }
  .name-input:focus { border-color: #8cf000; }
  .logo-input {
    background: #090a0f;
    border: 1px solid #282e3f;
    color: #9ca3af;
    font-size: 11px;
    padding: 5px 8px;
    border-radius: 4px;
    flex: 1;
    font-family: inherit;
  }

  /* Status Bar - 4 Clickable Indicators */
  .players-container {
    background: #090a0f;
    border: 1px solid #1a1d27;
    padding: 8px;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .players-title {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #6b7280;
    font-weight: 700;
  }
  .player-bars {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
  }
  .p-toggle {
    border: none;
    height: 32px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.1s ease;
  }
  .p-toggle.alive {
    background: #8cf000;
    color: #0b1500;
    box-shadow: 0 0 8px rgba(140, 240, 0, 0.25);
  }
  .p-toggle.dead {
    background: #1a1d27;
    color: #4b5563;
    border: 1px solid #242938;
  }

  /* Score & Elimination Controls */
  .score-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #090a0f;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid #1a1d27;
  }
  .score-display {
    font-size: 14px;
    font-weight: 700;
  }
  .score-display b {
    color: #fff;
    font-size: 18px;
    font-family: 'Chakra Petch', sans-serif;
    margin-left: 4px;
  }

  .kill-btns {
    display: flex;
    gap: 4px;
  }
  .btn-kill {
    border: none;
    padding: 6px 10px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 800;
    border-radius: 4px;
    cursor: pointer;
  }
  .btn-kill-add { background: #ef4444; color: #fff; }
  .btn-kill-add:hover { background: #dc2626; }
  .btn-kill-sub { background: #261618; color: #f87171; border: 1px solid #451b1e; }
  .btn-wipe-team { background: #1f2937; color: #9ca3af; border: 1px solid #374151; }
  .btn-wipe-team:hover { background: #374151; color: #fff; }
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- Top Navigation & Controls -->
  <div class="top-bar">
    <div class="title-group">
      <h2>ESPORTS CONTROL DESK</h2>
      <span>LIVE FIREBASE RTDB SYNC</span>
    </div>

    <!-- Match Timer -->
    <div class="timer-box">
      <span class="timer-clock" id="desk-timer">00:00</span>
      <button class="btn-timer btn-start" onclick="startTimer()">START</button>
      <button class="btn-timer btn-pause" onclick="pauseTimer()">PAUSE</button>
      <button class="btn-timer btn-reset" onclick="resetTimer()">RESET</button>
    </div>

    <!-- Quick Global Actions -->
    <div class="actions-group">
      <input type="text" id="search-box" class="search-input" placeholder="Search team..." onkeyup="filterCards()" />
      <button class="btn-top btn-revive" onclick="resetAllRevive()">REVIVE ALL (4/4)</button>
      <button class="btn-top btn-danger" onclick="confirmResetKills()">RESET KILLS</button>
    </div>
  </div>

  <!-- 12 Slot Interactive Grid -->
  <div class="grid" id="teams-grid"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBRcMrsrifYv-VDsCrTMKZuQiub30a7wEs",
    authDomain: "tournment-leaderboard.firebaseapp.com",
    databaseURL: "https://tournment-leaderboard-default-rtdb.firebaseio.com",
    projectId: "tournment-leaderboard",
    storageBucket: "tournment-leaderboard.firebasestorage.app",
    messagingSenderId: "685244342962",
    appId: "1:685244342962:web:d31c15a67fb9b6161f5fab",
    measurementId: "G-RKSK1ZBC5M"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const defaultTeams = [
    { name: "ELC", logo: "", kills: 6, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}] },
    { name: "TNG", logo: "", kills: 5, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}] },
    { name: "INF", logo: "", kills: 4, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'dead'}] },
    { name: "X2",  logo: "", kills: 4, players: [{status:'dead'},  {status:'alive'}, {status:'alive'}, {status:'alive'}] },
    { name: "TOP", logo: "", kills: 3, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}] },
    { name: "RPR", logo: "", kills: 2, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}] },
    { name: "DVX", logo: "", kills: 1, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}] },
    { name: "RFX", logo: "", kills: 1, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}] },
    { name: "TEC", logo: "", kills: 1, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}] },
    { name: "NK",  logo: "", kills: 1, players: [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'dead'}] },
    { name: "FES", logo: "", kills: 1, players: [{status:'alive'}, {status:'alive'}, {status:'dead'},  {status:'dead'}] },
    { name: "RA",  logo: "", kills: 3, players: [{status:'dead'},  {status:'dead'},  {status:'dead'},  {status:'dead'}] }
  ];

  let teams = defaultTeams;

  // 1. Database Listener
  db.ref('esports_data/teams').on('value', (snap) => {
    const val = snap.val();
    if (val && Array.isArray(val)) {
      teams = val;
      renderGrid();
    } else {
      sync();
    }
  });

  function sync() {
    db.ref('esports_data/teams').set(teams);
    renderGrid();
  }

  // 2. Timer Listener & Actions
  let timerState = { running: false, seconds: 0, startTimestamp: null };
  let localDeskInterval = null;

  db.ref('esports_data/timer').on('value', (snap) => {
    const val = snap.val();
    if (val) {
      timerState = val;
      updateDeskTimerUI();
    }
  });

  function formatTime(totalSec) {
    const m = String(Math.floor(totalSec / 60)).padStart(2, '0');
    const s = String(totalSec % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  function updateDeskTimerUI() {
    clearInterval(localDeskInterval);
    if (timerState.running && timerState.startTimestamp) {
      localDeskInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - timerState.startTimestamp) / 1000);
        document.getElementById('desk-timer').innerText = formatTime(elapsed);
      }, 1000);
      const elapsed = Math.floor((Date.now() - timerState.startTimestamp) / 1000);
      document.getElementById('desk-timer').innerText = formatTime(elapsed);
    } else {
      document.getElementById('desk-timer').innerText = formatTime(timerState.seconds || 0);
    }
  }

  function startTimer() {
    const currentSec = timerState.seconds || 0;
    db.ref('esports_data/timer').set({
      running: true,
      seconds: currentSec,
      startTimestamp: Date.now() - (currentSec * 1000)
    });
  }

  function pauseTimer() {
    if (!timerState.running) return;
    const elapsed = Math.floor((Date.now() - timerState.startTimestamp) / 1000);
    db.ref('esports_data/timer').set({
      running: false,
      seconds: elapsed,
      startTimestamp: null
    });
  }

  function resetTimer() {
    db.ref('esports_data/timer').set({
      running: false,
      seconds: 0,
      startTimestamp: null
    });
  }

  // 3. Fast Card Toggles
  function togglePlayer(tIdx, pIdx) {
    const current = teams[tIdx].players[pIdx].status === 'dead' ? 'dead' : 'alive';
    teams[tIdx].players[pIdx].status = current === 'alive' ? 'dead' : 'alive';
    teams[tIdx].alive = teams[tIdx].players.filter(p => p.status === 'alive').length;
    sync();
  }

  function adjustKill(tIdx, amount) {
    teams[tIdx].kills = Math.max(0, (teams[tIdx].kills || 0) + amount);
    sync();
  }

  function wipeTeam(tIdx) {
    teams[tIdx].players.forEach(p => p.status = 'dead');
    teams[tIdx].alive = 0;
    sync();
  }

  function resetAllRevive() {
    teams.forEach(t => {
      t.players = [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}];
      t.alive = 4;
    });
    sync();
  }

  function confirmResetKills() {
    if (confirm("Reset ALL team eliminations back to 0?")) {
      teams.forEach(t => t.kills = 0);
      sync();
    }
  }

  function filterCards() {
    const q = document.getElementById('search-box').value.toUpperCase();
    const cards = document.querySelectorAll('.team-card');
    cards.forEach(card => {
      const name = card.querySelector('.name-input').value.toUpperCase();
      card.style.display = name.includes(q) ? '' : 'none';
    });
  }

  function renderGrid() {
    const grid = document.getElementById('teams-grid');
    grid.innerHTML = '';

    teams.forEach((t, i) => {
      if (!t.players) {
        t.players = [{status:'alive'}, {status:'alive'}, {status:'alive'}, {status:'alive'}];
      }
      const isDead = t.players.every(p => p.status === 'dead');
      const aliveCount = t.players.filter(p => p.status === 'alive').length;

      let barsHtml = t.players.map((p, pIdx) => {
        const isAlive = p.status !== 'dead';
        return `
          <button class="p-toggle ${isAlive ? 'alive' : 'dead'}" onclick="togglePlayer(${i}, ${pIdx})" title="Click to toggle Player ${pIdx+1}">
            ${isAlive ? 'ALIVE' : 'DEAD'}
          </button>
        `;
      }).join('');

      grid.innerHTML += `
        <div class="team-card ${isDead ? 'wiped' : ''}">
          <div class="card-header">
            <span class="slot-tag">#${i + 1}</span>
            <input class="name-input" value="${t.name || ''}" onchange="teams[${i}].name=this.value.trim().toUpperCase(); sync();" />
            <input class="logo-input" placeholder="Logo URL" value="${t.logo || ''}" onchange="teams[${i}].logo=this.value.trim(); sync();" />
          </div>

          <div class="players-container">
            <div class="players-title">
              <span>SQUAD SENSORS</span>
              <span>${aliveCount} / 4 STANDING</span>
            </div>
            <div class="player-bars">
              ${barsHtml}
            </div>
          </div>

          <div class="score-row">
            <span class="score-display">ELIMS: <b>${t.kills || 0}</b></span>
            <div class="kill-btns">
              <button class="btn-kill btn-kill-add" onclick="adjustKill(${i}, 1)">+1</button>
              <button class="btn-kill btn-kill-sub" onclick="adjustKill(${i}, -1)">-1</button>
              <button class="btn-kill btn-wipe-team" onclick="wipeTeam(${i})">WIPE</button>
            </div>
          </div>
        </div>
      `;
    });
  }

  renderGrid();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Esports Cloud Admin Console</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0e12;
    color: #e2e4e9;
    font-family: 'Chakra Petch', sans-serif;
    padding: 16px;
  }

  #login-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(10, 11, 15, 0.96);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }
  .login-card {
    background: #181a22;
    border: 1px solid #282a36;
    padding: 30px;
    border-radius: 8px;
    width: 320px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .login-card h3 { color: #ffb800; text-align: center; }
  .login-card input {
    background: #0f1015; border: 1px solid #333644; color: #fff;
    padding: 10px; border-radius: 4px; font-family: inherit;
  }
  .login-btn {
    background: #ffb800; color: #000; font-weight: bold; border: none;
    padding: 10px; border-radius: 4px; cursor: pointer;
  }

  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #232630; padding-bottom: 14px; margin-bottom: 18px;
    flex-wrap: wrap; gap: 10px;
  }
  .top-bar h2 { font-size: 19px; color: #ffb800; }
  .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-header {
    border: none; padding: 8px 14px; border-radius: 4px;
    font-weight: bold; cursor: pointer; font-family: inherit; font-size: 12px;
  }
  .btn-new-tourney { background: #7a27d6; color: #fff; }
  .btn-reset-match { background: #d92d20; color: #fff; }
  .btn-logout { background: #282a36; color: #e2e4e9; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 14px;
  }

  .team-card {
    background: #171821; border: 1px solid #252834; border-radius: 6px;
    padding: 12px; display: flex; flex-direction: column; gap: 8px;
  }
  .team-card.eliminated { border-color: #611919; background: #151114; }

  .header-row { display: flex; align-items: center; gap: 8px; }
  .header-row .slot-num { color: #ffb800; font-weight: bold; font-size: 13px; }
  .name-input {
    background: #0d0e12; border: 1px solid #333642; color: #ffb800;
    font-weight: bold; padding: 5px 8px; border-radius: 4px; width: 90px;
    text-transform: uppercase;
  }
  .logo-input {
    background: #0d0e12; border: 1px solid #333642; color: #8e929b;
    font-size: 11px; padding: 5px; border-radius: 4px; flex: 1;
  }

  .stats-bar {
    display: flex; justify-content: space-between; background: #101117;
    padding: 6px 10px; border-radius: 4px; font-size: 13px;
  }
  .stats-bar span b { color: #fff; }

  .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  button {
    border: none; padding: 8px; font-weight: 700; border-radius: 4px;
    cursor: pointer; font-family: inherit; font-size: 12px;
  }
  .btn-kill { background: #d92d20; color: #fff; }
  .btn-kill-minus { background: #3b2225; color: #f97066; }
  .btn-alive-add { background: #12b76a; color: #fff; }
  .btn-alive-down { background: #f79009; color: #fff; }
  .btn-wipe { background: #475467; color: #fff; }
  .btn-team-reset { background: #232631; color: #8e929b; }
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div id="login-overlay">
    <div class="login-card">
      <h3>REMOTE ADMIN LOGIN</h3>
      <input type="text" id="username" placeholder="Username" />
      <input type="password" id="password" placeholder="Password" />
      <button class="login-btn" onclick="checkLogin()">LOGIN</button>
    </div>
  </div>

  <div class="top-bar">
    <h2>REMOTE CLOUD DESK</h2>
    <div class="top-actions">
      <button class="btn-header btn-new-tourney" onclick="newTournamentReset()">+ NEW TOURNAMENT (0 0)</button>
      <button class="btn-header btn-reset-match" onclick="resetCurrentMatch()">RESET CURRENT MATCH (NEXT MAP)</button>
      <button class="btn-header btn-logout" onclick="logout()">LOGOUT</button>
    </div>
  </div>

  <div class="grid" id="slots-grid"></div>

<script>
  const ADMIN_USER = "notxog";
  const ADMIN_PASS = "1234";

  if (sessionStorage.getItem('admin_logged_in') === 'true') {
    document.getElementById('login-overlay').style.display = 'none';
  }

  function checkLogin() {
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    if (u === ADMIN_USER && p === ADMIN_PASS) {
      sessionStorage.setItem('admin_logged_in', 'true');
      document.getElementById('login-overlay').style.display = 'none';
    } else {
      alert("Invalid password! Default is admin / 1234");
    }
  }

  function logout() {
    sessionStorage.removeItem('admin_logged_in');
    location.reload();
  }

  const firebaseConfig = {
    apiKey: "AIzaSyBRcMrsrifYv-VDsCrTMKZuQiub30a7wEs",
    authDomain: "tournment-leaderboard.firebaseapp.com",
    databaseURL: "https://tournment-leaderboard-default-rtdb.firebaseio.com",
    projectId: "tournment-leaderboard",
    storageBucket: "tournment-leaderboard.firebasestorage.app",
    messagingSenderId: "685244342962",
    appId: "1:685244342962:web:d31c15a67fb9b6161f5fab",
    measurementId: "G-RKSK1ZBC5M"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const defaultTeams = [
    { name: "SLOT 1", logo: "", kills: 0, placement: 0, alive: 4 },
    { name: "SLOT 2", logo: "", kills: 0, placement: 0, alive: 4 },
    { name: "SLOT 3", logo: "", kills: 0, placement: 0, alive: 4 },
    { name: "SLOT 4", logo: "", kills: 0, placement: 0, alive: 4 },
    { name: "SLOT 5", logo: "", kills: 0, placement: 0, alive: 4 },
    { name: "SLOT 6", logo: "", kills: 0, placement: 0, alive: 4 },
    { name: "SLOT 7", logo: "", kills: 0, placement: 0, alive: 4 },
    { name: "SLOT 8", logo: "", kills: 0, placement: 0, alive: 4 },
    { name: "SLOT 9", logo: "", kills: 0, placement: 0, alive: 4 },
    { name: "SLOT 10", logo: "", kills: 0, placement: 0, alive: 4 },
    { name: "SLOT 11", logo: "", kills: 0, placement: 0, alive: 4 },
    { name: "SLOT 12", logo: "", kills: 0, placement: 0, alive: 4 }
  ];

  let teams = defaultTeams;

  db.ref('esports_data/teams').on('value', (snap) => {
    const val = snap.val();
    if (val) {
      teams = val;
      renderController();
    } else {
      sync();
    }
  });

  function sync() {
    db.ref('esports_data/teams').set(teams);
    renderController();
  }

  function adjustKill(idx, amount) {
    teams[idx].kills = Math.max(0, teams[idx].kills + amount);
    sync();
  }

  function adjustAlive(idx, amount) {
    teams[idx].alive = Math.min(4, Math.max(0, teams[idx].alive + amount));
    sync();
  }

  function wipeSquad(idx) {
    teams[idx].alive = 0;
    sync();
  }

  function resetSingleTeam(idx) {
    teams[idx].kills = 0;
    teams[idx].placement = 0;
    teams[idx].alive = 4;
    sync();
  }

  function resetCurrentMatch() {
    if (confirm("Start next Map? Current map kills will be banked into Total Points, map kills reset to 0, and all squads revive to 4.")) {
      teams.forEach(t => {
        t.placement = (Number(t.placement) || 0) + (Number(t.kills) || 0);
        t.kills = 0;
        t.alive = 4;
      });
      db.ref('esports_data/resetSignal').set(Date.now());
      sync();
    }
  }

  function newTournamentReset() {
    const clearNames = confirm("Start a brand new tournament?\n\nOK = reset points to 0 AND reset names to SLOT 1-12.\nCancel = reset points to 0 but keep team names.");
    if (clearNames) {
      teams = defaultTeams.map(t => ({ ...t }));
    } else {
      teams.forEach(t => {
        t.kills = 0;
        t.placement = 0;
        t.alive = 4;
      });
    }
    db.ref('esports_data/resetSignal').set(Date.now());
    sync();
  }

  function renderController() {
    const grid = document.getElementById('slots-grid');
    grid.innerHTML = '';

    teams.forEach((t, i) => {
      const isDead = t.alive === 0;
      const totalPoints = (Number(t.kills) || 0) + (Number(t.placement) || 0);

      grid.innerHTML += `
        <div class="team-card ${isDead ? 'eliminated' : ''}">
          <div class="header-row">
            <span class="slot-num">#${i + 1}</span>
            <input class="name-input" value="${t.name}" onchange="teams[${i}].name=this.value; sync();" />
            <input class="logo-input" placeholder="Logo URL" value="${t.logo}" onchange="teams[${i}].logo=this.value; sync();" />
          </div>

          <div class="stats-bar">
            <span>Map Kills: <b>${t.kills}</b></span>
            <span>Total Pts: <b>${totalPoints}</b></span>
            <span>Alive: <b>${t.alive}/4</b></span>
          </div>

          <div class="controls-grid">
            <button class="btn-kill" onclick="adjustKill(${i}, 1)">+1 KILL</button>
            <button class="btn-alive-add" onclick="adjustAlive(${i}, 1)">+1 ALIVE</button>
            <button class="btn-kill-minus" onclick="adjustKill(${i}, -1)">-1 KILL</button>
            <button class="btn-alive-down" onclick="adjustAlive(${i}, -1)">-1 ALIVE</button>
            <button class="btn-wipe" onclick="wipeSquad(${i})">WIPE SQUAD (0)</button>
            <button class="btn-team-reset" onclick="resetSingleTeam(${i})">RESET SLOT</button>
          </div>
        </div>
      `;
    });
  }

  renderController();
</script>
</body>
</html>

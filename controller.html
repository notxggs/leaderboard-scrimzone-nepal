<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScrimZone Nepal — Controller</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600&family=Inter:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    body {
      background: #0b101a;
      color: #fff;
      font-family: 'Inter', sans-serif;
      margin: 0; padding: 20px;
    }
    
    .panel-container {
      background: #111724;
      border: 1px solid #1f2b40;
      border-radius: 8px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .header-title {
      font-family: 'Teko', sans-serif;
      color: #ffb300;
      font-size: 32px;
      line-height: 1;
      letter-spacing: 1px;
    }
    .header-sub { font-size: 11px; color: #5c728a; text-transform: uppercase; margin-bottom: 20px; }

    .control-bar {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #0d121c;
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid #1f2b40;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .ctrl-item { display: flex; align-items: center; gap: 8px; }
    .ctrl-label { font-size: 12px; color: #5c728a; font-weight: 700; }
    select, input {
      background: #000;
      border: 1px solid #2a3a52;
      color: #fff;
      padding: 6px;
      border-radius: 4px;
      font-family: 'Inter';
      font-weight: 700;
    }

    .timer-box {
      font-family: 'Teko', sans-serif;
      font-size: 28px;
      color: #4fc3f7;
      background: #000;
      padding: 0 15px;
      border-radius: 4px;
      border: 1px solid #2a3a52;
      line-height: 1.2;
    }

    button {
      font-family: 'Inter'; font-weight: 700; font-size: 12px;
      padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer;
    }
    .btn-gold { background: #ffb300; color: #000; }
    .btn-gold:hover { background: #ffa000; }
    .btn-red { background: #e53935; color: #fff; }
    .btn-dark { background: #1f2b40; color: #fff; }

    .focus-bar {
      background: #0d121c; border: 1px solid #1f2b40; padding: 15px;
      border-radius: 8px; margin-bottom: 20px;
    }
    .focus-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .btn-focus { background: #151e2e; border: 1px solid #2a3a52; color: #fff; padding: 6px 12px; border-radius: 4px; }
    .btn-focus.active { background: #1976d2; border-color: #42a5f5; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .team-card {
      background: #111724; border: 1px solid #1f2b40;
      border-radius: 8px; padding: 15px;
    }
    .team-card.focused { border-color: #ffb300; }
    
    .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .slot-num { font-family: 'Teko'; font-size: 24px; color: #ffb300; }
    .team-name { font-weight: 700; font-size: 14px; }
    
    .roster {
      background: #0d121c; border: 1px solid #1a2436; padding: 10px;
      font-size: 11px; color: #5c728a; border-radius: 4px; line-height: 1.6; margin-bottom: 12px;
    }

    .card-actions { display: flex; justify-content: space-between; align-items: center; }
    .booyah-ctrl { display: flex; background: #000; border-radius: 4px; border: 1px solid #2a3a52; }
    .booyah-btn { background: none; color: #fff; padding: 4px 10px; }
    .booyah-val { color: #ffb300; font-weight: bold; padding: 4px; font-size: 12px; }
  </style>
</head>
<body>

  <div class="panel-container">
    <div class="header-title">SCRIMZONE BROADCAST CONTROLLER</div>
    <div class="header-sub">AUTOMATED DISCORD & OBS DATA SYNC</div>

    <div class="control-bar">
      <!-- ADDED oninput ALONG WITH onchange TO GUARANTEE INSTANT UPDATES -->
      <div class="ctrl-item">
        <span class="ctrl-label">MATCH:</span>
        <input type="number" id="match-input" value="1" min="1" max="15" style="width:50px;" onchange="updateMeta()" oninput="updateMeta()">
      </div>
      <div class="ctrl-item">
        <span class="ctrl-label">MAP:</span>
        <select id="map-select" onchange="updateMeta()" oninput="updateMeta()">
          <option value="BERMUDA">BERMUDA</option>
          <option value="PURGATORY">PURGATORY</option>
          <option value="KALAHARI">KALAHARI</option>
          <option value="NEXTERRA">NEXTERRA</option>
          <option value="ALPINE">ALPINE</option>
        </select>
      </div>

      <div class="ctrl-item" style="margin-left: 20px;">
        <div class="timer-box" id="timer-text">00:00</div>
        <button class="btn-gold" id="btn-timer" onclick="toggleTimer()">START</button>
        <button class="btn-dark" onclick="resetTimer()">RESET</button>
      </div>

      <div style="flex-grow: 1;"></div>
      <button class="btn-gold" onclick="initSlots()">INIT 12 SLOTS</button>
      <button class="btn-red" onclick="resetAll()">RESET SCRIM</button>
    </div>

    <div class="focus-bar">
      <div class="ctrl-label">CLICK A TEAM TO FOCUS ON SPECTATOR OVERLAY:</div>
      <div class="focus-grid" id="focus-btns"></div>
    </div>

    <div class="grid" id="team-grid"></div>
  </div>

  <script>
    firebase.initializeApp({
      databaseURL: "https://tournment-leaderboard-default-rtdb.firebaseio.com"
    });
    const db = firebase.database();

    let teamsList = [];
    let focusIdx = 0;
    let tSecs = 0;
    let tRun = false;
    let tInt = null;

    // 1. SYNC META (Map, Match, Focus)
    db.ref("esports_data/config").on("value", snap => {
      const cfg = snap.val() || {};
      if (cfg.match) document.getElementById("match-input").value = cfg.match;
      if (cfg.map) document.getElementById("map-select").value = cfg.map;
      focusIdx = cfg.focused_index || 0;
      buildFocusBar();
      buildGrid();
    });

    // 2. SYNC TIMER
    db.ref("esports_data/timer").on("value", snap => {
      const t = snap.val() || {};
      tSecs = t.seconds || 0;
      tRun = t.running || false;
      renderTime();
    });

    // 3. SYNC TEAMS
    db.ref("esports_data/teams").on("value", snap => {
      teamsList = snap.val() || Array(12).fill({ name: "OPEN SLOT", booyahs: 0 });
      buildFocusBar();
      buildGrid();
    });

    function updateMeta() {
      db.ref("esports_data/config").update({
        match: parseInt(document.getElementById("match-input").value) || 1,
        map: document.getElementById("map-select").value
      });
    }

    function setFocus(idx) {
      db.ref("esports_data/config").update({ focused_index: idx });
    }

    function updateBooyah(idx, change) {
      if (!teamsList[idx]) return;
      let val = (teamsList[idx].booyahs || 0) + change;
      if (val < 0) val = 0;
      db.ref(`esports_data/teams/${idx}/booyahs`).set(val);
    }

    function toggleTimer() {
      db.ref("esports_data/timer").update({ running: !tRun, seconds: tSecs });
    }

    function resetTimer() {
      db.ref("esports_data/timer").set({ running: false, seconds: 0 });
    }

    function renderTime() {
      const m = Math.floor(tSecs / 60).toString().padStart(2, '0');
      const s = (tSecs % 60).toString().padStart(2, '0');
      document.getElementById("timer-text").innerText = `${m}:${s}`;
      
      const btn = document.getElementById("btn-timer");
      if (tRun) {
        btn.innerText = "PAUSE";
        if (!tInt) tInt = setInterval(() => {
          tSecs++;
          const mm = Math.floor(tSecs / 60).toString().padStart(2, '0');
          const ss = (tSecs % 60).toString().padStart(2, '0');
          document.getElementById("timer-text").innerText = `${mm}:${ss}`;
        }, 1000);
      } else {
        btn.innerText = "START";
        if (tInt) { clearInterval(tInt); tInt = null; }
      }
    }

    function initSlots() {
      if(confirm("Init 12 fresh open slots?")) {
        const fresh = [];
        for(let i=1; i<=12; i++) fresh.push({ name: `SLOT ${i} (OPEN)`, booyahs: 0 });
        db.ref("esports_data/teams").set(fresh);
      }
    }

    function resetAll() {
      if(confirm("Wipe everything? Timer, map, and teams?")) {
        initSlots();
        resetTimer();
        db.ref("esports_data/config").set({ match: 1, map: "BERMUDA", focused_index: 0 });
      }
    }

    function buildFocusBar() {
      const bar = document.getElementById("focus-btns");
      bar.innerHTML = "";
      for (let i=0; i<12; i++) {
        const t = teamsList[i] || {};
        const name = (t.name && !t.name.includes("OPEN")) ? t.name.substring(0,8) : `SLOT ${i+1}`;
        bar.innerHTML += `<button class="btn-focus ${focusIdx === i ? 'active':''}" onclick="setFocus(${i})">#${i+1} ${name}</button>`;
      }
    }

    function buildGrid() {
      const grid = document.getElementById("team-grid");
      grid.innerHTML = "";
      for (let i=0; i<12; i++) {
        const t = teamsList[i] || {};
        const booyahs = t.booyahs || 0;
        const name = t.name || t.teamName || `SLOT ${i+1} (OPEN)`;
        const roster = t.roster ? t.roster.join('<br>') : '1. -<br>2. -<br>3. -<br>4. -';

        grid.innerHTML += `
          <div class="team-card ${focusIdx === i ? 'focused' : ''}">
            <div class="card-head">
              <span class="slot-num">#${i+1}</span>
              <div class="team-name">${name}</div>
            </div>
            <div class="roster">${roster}</div>
            <div class="card-actions">
              <button class="btn-dark" onclick="setFocus(${i})">FOCUS</button>
              <div class="booyah-ctrl">
                <button class="booyah-btn" onclick="updateBooyah(${i}, -1)">-</button>
                <span class="booyah-val">${booyahs} 🏆</span>
                <button class="booyah-btn" onclick="updateBooyah(${i}, 1)">+</button>
              </div>
            </div>
          </div>
        `;
      }
    }
  </script>
</body>
</html>

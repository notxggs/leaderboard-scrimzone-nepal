<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScrimZone Nepal — Premium Team Registration</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700;800&family=Rajdhani:wght@600;700;800&family=Teko:wght@700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #06080d;
    color: #e2e8f0;
    font-family: 'Rajdhani', sans-serif;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .container {
    width: 100%;
    max-width: 600px;
    background: linear-gradient(180deg, #121722 0%, #0a0d14 100%);
    border: 1.5px solid #d4af37;
    border-radius: 8px;
    padding: 24px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.9);
  }
  h1 { font-family: 'Teko', sans-serif; font-size: 36px; color: #fff; text-transform: uppercase; letter-spacing: 2px; text-align: center; }
  .subtitle { font-family: 'Chakra Petch', sans-serif; font-size: 12px; color: #d4af37; text-align: center; letter-spacing: 2px; margin-bottom: 20px; text-transform: uppercase; }
  .form-group { margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
  label { font-family: 'Chakra Petch', sans-serif; font-size: 12px; font-weight: 800; color: #94a3b8; text-transform: uppercase; }
  input, select { background: #05070a; border: 1px solid #1e293b; color: #fff; padding: 10px; border-radius: 4px; font-family: inherit; font-size: 15px; font-weight: 700; }
  input:focus { border-color: #d4af37; outline: none; box-shadow: 0 0 8px rgba(212,175,55,0.4); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-submit { background: linear-gradient(135deg, #d4af37 0%, #aa820a 100%); color: #000; font-family: 'Chakra Petch', sans-serif; font-weight: 800; font-size: 15px; padding: 12px; border: none; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; text-transform: uppercase; box-shadow: 0 0 15px rgba(212,175,55,0.3); }
  .btn-submit:hover { background: #f0cb53; }
  #status-box { margin-top: 15px; text-align: center; font-weight: bold; font-family: 'Chakra Petch', sans-serif; }
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
</head>
<body>

<div class="container">
  <h1>ScrimZone Nepal</h1>
  <div class="subtitle">Premium Team Registration (Fee: Rs. 100)</div>

  <div id="loading-auth" style="text-align:center; padding: 20px; color:#d4af37;">Validating Discord Session Token...</div>

  <form id="premium-form" style="display:none;" onsubmit="submitApplication(event)">
    <div class="form-group">
      <label>Team Name</label>
      <input type="text" id="team_name" required placeholder="e.g. Example Esports">
    </div>
    <div class="form-group">
      <label>Team Tag</label>
      <input type="text" id="team_tag" required maxlength="6" placeholder="e.g. EX">
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label>Leader Name (IGL)</label>
        <input type="text" id="leader_name" required placeholder="IGL IGN">
      </div>
      <div class="form-group">
        <label>Leader UID</label>
        <input type="text" id="leader_uid" required placeholder="Free Fire UID">
      </div>
    </div>

    <hr style="border-color:#1e293b; margin: 15px 0;">
    <label style="color:#d4af37; margin-bottom:6px; display:block;">Squad Roster</label>

    <div class="grid-2"><input type="text" id="p1_name" placeholder="Player 1 IGN" required><input type="text" id="p1_uid" placeholder="Player 1 UID" required></div>
    <div class="grid-2" style="margin-top:8px;"><input type="text" id="p2_name" placeholder="Player 2 IGN" required><input type="text" id="p2_uid" placeholder="Player 2 UID" required></div>
    <div class="grid-2" style="margin-top:8px;"><input type="text" id="p3_name" placeholder="Player 3 IGN" required><input type="text" id="p3_uid" placeholder="Player 3 UID" required></div>
    <div class="grid-2" style="margin-top:8px;"><input type="text" id="sub_name" placeholder="Substitute IGN (Opt.)"><input type="text" id="sub_uid" placeholder="Substitute UID (Opt.)"></div>

    <div class="form-group" style="margin-top:15px;">
      <label>Team Logo (PNG / JPG / WEBP)</label>
      <input type="file" id="logo_file" accept="image/png, image/jpeg, image/webp" required>
    </div>

    <button type="submit" class="btn-submit" id="submit-btn">Submit Premium Application</button>
  </form>
  <div id="status-box"></div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBRcMrsrifYv-VDsCrTMKZuQiub30a7wEs",
    authDomain: "tournment-leaderboard.firebaseapp.com",
    databaseURL: "https://tournment-leaderboard-default-rtdb.firebaseio.com",
    projectId: "tournment-leaderboard",
    storageBucket: "tournment-leaderboard.firebasestorage.app",
    messagingSenderId: "685244342962",
    appId: "1:685244342962:web:d31c15a67fb9b6161f5fab",
    measurementId: "G-RKSK1ZBC5M"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const storage = firebase.storage();

  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');
  let verifiedDiscordUserId = null;

  if (!token) {
    document.getElementById('loading-auth').innerHTML = "❌ Invalid or missing authentication token. Please use the button from your Discord account panel.";
  } else {
    db.ref(`premium_tokens/${token}`).once('value').then(snap => {
      const val = snap.val();
      if (!val || val.expires_at < Date.now() / 1000) {
        document.getElementById('loading-auth').innerHTML = "❌ Token expired or invalid. Please generate a new link from Discord.";
      } else {
        verifiedDiscordUserId = val.discord_user_id;
        document.getElementById('loading-auth').style.display = 'none';
        document.getElementById('premium-form').style.display = 'block';
      }
    });
  }

  async function submitApplication(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const statusBox = document.getElementById('status-box');
    btn.disabled = true;
    btn.innerText = 'UPLOADING & SUBMITTING...';

    try {
      const fileInput = document.getElementById('logo_file').files[0];
      if (!fileInput) throw new Error("Please select a team logo image.");

      const appId = 'APP-' + Math.random().toString(36).substring(2, 9).toUpperCase();
      const storageRef = storage.ref(`premium-logos/${verifiedDiscordUserId}/${appId}.png`);
      
      statusBox.style.color = '#d4af37';
      statusBox.innerText = 'Uploading logo to Firebase Storage...';
      
      const snapshot = await storageRef.put(fileInput);
      const downloadURL = await snapshot.ref.getDownloadURL();

      statusBox.innerText = 'Saving application to database...';

      const payload = {
        discord_user_id: verifiedDiscordUserId,
        team_name: document.getElementById('team_name').value.trim(),
        team_tag: document.getElementById('team_tag').value.trim().toUpperCase(),
        leader_name: document.getElementById('leader_name').value.trim(),
        leader_uid: document.getElementById('leader_uid').value.trim(),
        roster: [
          { name: document.getElementById('p1_name').value.trim(), uid: document.getElementById('p1_uid').value.trim() },
          { name: document.getElementById('p2_name').value.trim(), uid: document.getElementById('p2_uid').value.trim() },
          { name: document.getElementById('p3_name').value.trim(), uid: document.getElementById('p3_uid').value.trim() }
        ],
        substitute: {
          name: document.getElementById('sub_name').value.trim(),
          uid: document.getElementById('sub_uid').value.trim()
        },
        logo: downloadURL,
        payment: { amount: 100, currency: "NPR", status: "pending_deduction" },
        status: "pending",
        created_at: Date.now(),
        approved_at: null
      };

      await db.ref(`esports_data/premium_applications/${appId}`).set(payload);
      // Remove token so it cannot be reused
      await db.ref(`premium_tokens/${token}`).remove();

      document.getElementById('premium-form').style.display = 'none';
      statusBox.style.color = '#22c55e';
      statusBox.innerHTML = `✅ Application Submitted Successfully!<br><br>Application ID: <b>${appId}</b><br>Status: <b>Pending Admin Approval</b><br><br>You can now close this window and return to Discord.`;

    } catch (err) {
      btn.disabled = false;
      btn.innerText = 'Submit Premium Application';
      statusBox.style.color = '#ef4444';
      statusBox.innerText = 'Error: ' + err.message;
    }
  }
</script>
</body>
</html>

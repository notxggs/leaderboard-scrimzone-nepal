<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScrimZone Nepal — OBS Live Overlay</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: 'Inter', sans-serif;
      color: #fff;
      overflow: hidden;
      width: 1920px;
      height: 1080px;
      position: relative;
    }

    /* TOP BROADCAST BAR */
    .top-bar {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      background: rgba(11, 16, 26, 0.95);
      border: 2px solid #223049;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    .bar-segment {
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-right: 1px solid rgba(255,255,255,0.08);
    }
    .bar-segment:last-child { border-right: none; }

    .segment-label {
      font-family: 'Teko', sans-serif;
      font-size: 22px;
      color: #ff9800;
      letter-spacing: 1px;
    }

    .segment-value {
      font-family: 'Teko', sans-serif;
      font-size: 28px;
      letter-spacing: 1px;
      color: #fff;
    }

    .timer-val {
      color: #64b5f6;
      min-width: 70px;
      text-align: center;
    }

    /* PLAYING TEAMS LEADERBOARD (LEFT SIDE) */
    .leaderboard-container {
      position: absolute;
      top: 100px;
      left: 35px;
      width: 320px;
      background: rgba(11, 16, 26, 0.94);
      border: 2px solid #223049;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.85);
    }

    .board-header {
      background: #1565c0;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .board-title {
      font-family: 'Teko', sans-serif;
      font-size: 24px;
      letter-spacing: 1px;
      font-weight: 700;
    }

    .board-time {
      font-size: 12px;
      font-weight: 700;
      background: rgba(0,0,0,0.3);
      padding: 3px 8px;
      border-radius: 4px;
    }

    .team-row {
      display: flex;
      align-items: center;
      padding: 6px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: background 0.2s ease;
    }
    .team-row:nth-child(even) { background: rgba(255,255,255,0.02); }
    .team-row.focused {
      background: rgba(255, 152, 0, 0.2);
      border-left: 4px solid #ff9800;
    }

    .team-num {
      font-family: 'Teko', sans-serif;
      font-size: 22px;
      color: #ff9800;
      width: 30px;
    }

    .team-icon {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      object-fit: cover;
      margin-right: 10px;
      background: #0e141f;
      border: 1px solid #223049;
    }

    .team-title {
      font-size: 13px;
      font-weight: 700;
      flex-grow: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .booyah-badge {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 12px;
      font-weight: 800;
      color: #ffca28;
    }
  </style>
</head>
<body>

  <!-- Top Broadcast Ticker -->
  <div class="top-bar">
    <div class="bar-segment">
      <span class="segment-label">MATCH:</span>
      <span class="segment-value" id="match-val">1</span>
    </div>
    <div class="bar-segment">
      <span class="segment-label">MAP:</span>
      <span class="segment-value" id="map-val">BERMUDA</span>
    </div>
    <div class="bar-segment">
      <span class="segment-label">TIMER:</span>
      <span class="segment-value timer-val" id="timer-val">00:00</span>
    </div>
  </div>

  <!-- Left Sidebar Roster -->
  <div class="leaderboard-container">
    <div class="board-header">
      <span class="board-title">PLAYING TEAMS</span>
      <span class="board-time">09:00 PM</span>
    </div>
    <div id="teams-list"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBRcMrsrifYv-VDsCrTMKZuQiub30a7wEs",
      authDomain: "tournment-leaderboard.firebaseapp.com",
      databaseURL: "https://tournment-leaderboard-default-rtdb.firebaseio.com",
      projectId: "tournment-leaderboard",
      storageBucket: "tournment-leaderboard.firebasestorage.app",
      messagingSenderId: "685244342962",
      appId: "1:685244342962:web:d31c15a67fb9b6161f5fab"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let focusedIndex = -1;
    let timerSecs = 0;
    let timerInterval = null;

    // 1. Sync Config (Map, Match Number, Camera Focus)
    db.ref("esports_data/config").on("value", snap => {
      const cfg = snap.val() || {};
      document.getElementById("match-val").innerText = cfg.match || "1";
      document.getElementById("map-val").innerText = (cfg.map || "BERMUDA").toUpperCase();
      focusedIndex = cfg.focused_index !== undefined ? cfg.focused_index : -1;
      highlightFocus();
    });

    // 2. Sync Shared Timer
    db.ref("esports_data/timer").on("value", snap => {
      const t = snap.val() || {};
      timerSecs = t.seconds || 0;
      const isRunning = t.running || false;

      const mins = Math.floor(timerSecs / 60).toString().padStart(2, '0');
      const secs = (timerSecs % 60).toString().padStart(2, '0');
      document.getElementById("timer-val").innerText = `${mins}:${secs}`;

      if (isRunning) {
        if (!timerInterval) {
          timerInterval = setInterval(() => {
            timerSecs++;
            const m = Math.floor(timerSecs / 60).toString().padStart(2, '0');
            const s = (timerSecs % 60).toString().padStart(2, '0');
            document.getElementById("timer-val").innerText = `${m}:${s}`;
          }, 1000);
        }
      } else {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      }
    });

    // 3. Sync Teams & Booyahs
    db.ref("esports_data/teams").on("value", snap => {
      const teams = snap.val() || [];
      const list = document.getElementById("teams-list");
      list.innerHTML = "";

      for (let i = 0; i < 12; i++) {
        const t = teams[i] || {};
        const booyahs = t.booyahs || 0;
        const name = t.name || t.teamName || `SLOT ${i + 1}`;
        const logo = t.logo || "https://via.placeholder.com/28/0e141f/7e8fa4?text=S";

        list.innerHTML += `
          <div class="team-row ${focusedIndex === i ? 'focused' : ''}" id="team-row-${i}">
            <span class="team-num">#${i + 1}</span>
            <img src="${logo}" class="team-icon" onerror="this.src='https://via.placeholder.com/28/0e141f/7e8fa4?text=S'">
            <span class="team-title">${name}</span>
            ${booyahs > 0 ? `<span class="booyah-badge">🏆 x${booyahs}</span>` : ''}
          </div>
        `;
      }
    });

    function highlightFocus() {
      for (let i = 0; i < 12; i++) {
        const row = document.getElementById(`team-row-${i}`);
        if (row) {
          if (i === focusedIndex) {
            row.classList.add("focused");
          } else {
            row.classList.remove("focused");
          }
        }
      }
    }
  </script>
</body>
</html>
